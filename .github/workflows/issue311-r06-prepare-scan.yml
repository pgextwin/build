name: Issue 311 R06 PREPARE original fleet scan (NONPUBLISHING)

# One exact approved PREPARE request only; original ZIP remains nonpublishing and cannot authorize local writer by itself.
on:
  push:
    branches: [main]
    paths:
      - ".github/execution-requests/r-*-r06prepare*.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-r06-prepare-immutable-original
  cancel-in-progress: false

jobs:
  scan:
    name: Scan immutable one-shot 17 protected upstreams, no candidate
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Authenticated central GET scan and original fixed-request receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r06-prepare-scan.py scan
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-prepare-original-scan
          path: issue311-r06-prepare-original-scan.json
          if-no-files-found: error
          retention-days: 30
