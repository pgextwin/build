name: Issue 311 R06 original request-bound central fleet scan (NONPUBLISHING)

# One exact approved AUDIT_ONLY request only, no schedule, no dispatch.
on:
  push:
    branches: [main]
    paths:
      - ".github/execution-requests/r-20261029-r06scanproof001.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-r06-central-immutable-original
  cancel-in-progress: false

jobs:
  scan:
    name: Scan immutable one-shot 17 protected upstreams, no candidate
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Authenticated central GET scan and original fixed-request receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r06-request-scan.py scan
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-original-scan
          path: issue311-r06-original-scan.json
          if-no-files-found: error
          retention-days: 30
