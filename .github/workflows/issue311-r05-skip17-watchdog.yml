name: Issue 311 R05 real 17-target skipped-child watchdog (NONPUBLISHING)
# Independent original push, not a workflow_run child; no cron or dispatch.
# The matching source workflow is intentionally not subscribed by any bridge.
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261029-r05skip17c01.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: issue311-r05-controlled-skipped-17-watchdog
  cancel-in-progress: false
jobs:
  finite:
    name: Rehash original 17 receipt ZIP, verify missing bridge and commit finite App terminal
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    environment: issue311-state-writer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Independently observe actual source ZIP and absent bridge until immutable deadline
        env:
          ISSUE311_PROOF_CASE: skipped-17
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r05-finite-watchdog.py observe
      - name: Persist immutable 17-target QUARANTINED with dedicated App
        env:
          ISSUE311_PROOF_CASE: skipped-17
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r05-finite-watchdog.py finalize
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-controlled-skipped-17-observation
          path: issue311-r04r05-watchdog-observation.json
          if-no-files-found: error
          retention-days: 30
