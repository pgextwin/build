name: Issue 311 R05 two-stage needs coordinator proof (NONPUBLISHING)

# A one-shot authenticated request path; NO cron, GITHUB_TOKEN generated
# event chain, dispatch, issue-comment commands, writes, OIDC or publisher.
on:
  push:
    branches: [main]
    paths:
      - ".github/execution-requests/r-20261029-r05nonpublishing001.json"

permissions:
  contents: read

concurrency:
  group: issue311-r05-nonpublishing-probe
  cancel-in-progress: false

jobs:
  admit:
    name: Stage 1 - strict AUDIT_ONLY original main-push observation
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      request_sha: ${{ steps.verify.outputs.request_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install schema validator for isolated read-only declaration test
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate original event and inert request on exact main
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,pathlib,subprocess
          target=".github/execution-requests/r-20261029-r05nonpublishing001.json"
          spec=importlib.util.spec_from_file_location("issue311_contract","scripts/issue311-request-contract.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          receipt=module.validate_declaration(pathlib.Path(target).read_bytes(),target)
          event=json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if not (os.environ["GITHUB_EVENT_NAME"]=="push" and os.environ["GITHUB_REF"]=="refs/heads/main"
                  and os.environ["GITHUB_REPOSITORY"]=="pgextwin/build"
                  and event.get("repository",{}).get("full_name")=="pgextwin/build"
                  and event.get("after")==head==os.environ["GITHUB_SHA"]
                  and event.get("created") is False and event.get("deleted") is False
                  and receipt["mode"]=="AUDIT_ONLY" and not receipt["publicationAuthorized"]):
              raise SystemExit("R05_DENY: wrong original push or request mode")
          result={"result":"STAGE1_AUDIT_ONLY","requestId":receipt["requestId"],
                  "rawSha256":receipt["rawSha256"],"runId":int(os.environ["GITHUB_RUN_ID"]),
                  "runAttempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "actor":os.environ["GITHUB_ACTOR"],"sender":(event.get("sender") or {}).get("login"),
                  "headSha":head,"publishAuthorized":False}
          pathlib.Path("issue311-r05-stage1.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("request_sha="+receipt["rawSha256"]+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-original-stage1
          path: issue311-r05-stage1.json
          if-no-files-found: error
          retention-days: 30

  stage2:
    name: Stage 2 - independently rehash same approved bytes in needs successor
    needs: [admit]
    if: needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_sha: ${{ steps.verify.outputs.request_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross-job digest binding without event dispatch or publication
        id: verify
        env:
          STAGE1_SHA: ${{ needs.admit.outputs.request_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(".github/execution-requests/r-20261029-r05nonpublishing001.json")
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if not (sha==os.environ["STAGE1_SHA"] and head==os.environ["GITHUB_SHA"]
                  and os.environ["GITHUB_EVENT_NAME"]=="push"):
              raise SystemExit("R05_DENY: cross-job request or main SHA mismatch")
          result={"result":"STAGE2_BOUND_TO_STAGE1","rawSha256":sha,
                  "headSha":head,"runId":int(os.environ["GITHUB_RUN_ID"]),
                  "publishAuthorized":False}
          pathlib.Path("issue311-r05-stage2.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("request_sha="+sha+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-original-stage2
          path: issue311-r05-stage2.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Terminal aggregator - always preserve original outcome and DENY publication
    needs: [admit, stage2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Produce terminal outcome even when children fail or skip
        env:
          ADMIT_RESULT: ${{ needs.admit.result }}
          STAGE2_RESULT: ${{ needs.stage2.result }}
          ADMIT_SHA: ${{ needs.admit.outputs.request_sha }}
          STAGE2_SHA: ${{ needs.stage2.outputs.request_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          ok=(os.environ["ADMIT_RESULT"]=="success" and os.environ["STAGE2_RESULT"]=="success"
              and len(os.environ["ADMIT_SHA"])==64 and os.environ["ADMIT_SHA"]==os.environ["STAGE2_SHA"])
          result={"schemaVersion":1,"requestId":"r-20261029-r05nonpublishing001",
                  "runId":int(os.environ["GITHUB_RUN_ID"]),
                  "runAttempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "stage1":os.environ["ADMIT_RESULT"],"stage2":os.environ["STAGE2_RESULT"],
                  "requestByteSha256":os.environ["ADMIT_SHA"],
                  "terminal":"NO_UPDATE" if ok else "FAILED",
                  "reason":"No new release requested; two original read-only stages proved" if ok
                           else "Child failure/skip or digest mismatch; manual evidence inspection required",
                  "publishAuthorized":False,"statePersistenceAccepted":False,
                  "eventChainKind":"single-original-push-with-needs"}
          pathlib.Path("issue311-r05-terminal.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("R05 nonpublishing two-step receipt; terminal="+result["terminal"]+
                        "; PUBLISH_DENY; durable CAS and cross-repo dispatch NOT accepted.\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-original-terminal
          path: issue311-r05-terminal.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail incomplete two-stage acceptance
        env:
          ADMIT_RESULT: ${{ needs.admit.result }}
          STAGE2_RESULT: ${{ needs.stage2.result }}
          ADMIT_SHA: ${{ needs.admit.outputs.request_sha }}
          STAGE2_SHA: ${{ needs.stage2.outputs.request_sha }}
        shell: bash
        run: |
          if [[ "$ADMIT_RESULT" != success || "$STAGE2_RESULT" != success || -z "$ADMIT_SHA" || "$ADMIT_SHA" != "$STAGE2_SHA" ]]; then
            echo "R05_NEGATIVE: dependent child failure/skip or mismatched digest; PUBLISH_DENY"
            exit 1
          fi
