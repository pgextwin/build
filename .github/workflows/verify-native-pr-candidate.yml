name: Independently verify existing PR Windows candidate artifacts (NONPUBLISHING)

on:
  workflow_call:
    inputs:
      ci_run_id:
        description: Existing completed native pull_request Windows CI/CD run ID
        required: true
        type: number

permissions:
  contents: read

jobs:
  audit:
    name: Read-only exact-run PR ZIP, SPDX and upstream audit
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.action == 'completed' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'Windows CI/CD' &&
          github.event.workflow_run.id == inputs.ci_run_id &&
          startsWith(github.event.workflow_run.head_branch, 'auto-candidate/') &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout pinned shared verifier (not candidate branch code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build
          persist-credentials: false

      - name: Set up Python (auditor only; never executes candidate scripts)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Authenticate exact existing PR CI, required App15368 and merge ref
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/verify-native-pr-run.py \
            --run-id "$RUN_ID" \
            --output "$RUNNER_TEMP/native-pr-ci-context.json"

      - name: Checkout only exact PR HEAD manifest; never execute its scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.verify.outputs.head }}
          path: candidate
          persist-credentials: false

      - name: Re-download and check all already-built genuine Windows artifacts
        id: audited
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          PR_NUMBER: ${{ steps.verify.outputs.pr }}
          HEAD_SHA: ${{ steps.verify.outputs.head }}
          MERGE_SHA: ${{ steps.verify.outputs.merge }}
          CANDIDATE_BRANCH: ${{ steps.verify.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/verify-candidate.py \
            --extension candidate/config/extension.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$CANDIDATE_BRANCH" \
            --sha "$HEAD_SHA" \
            --run-id "$RUN_ID" \
            --event pull_request \
            --merge-sha "$MERGE_SHA" \
            --pr "$PR_NUMBER" \
            --matrix-result success \
            --output "$RUNNER_TEMP/candidate-audit-native-pr.json"

      - name: Upload distinct PR audit (NOT original dispatch audit, NOT publishing)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-audit-native-pr
          path: |
            ${{ runner.temp }}/native-pr-ci-context.json
            ${{ runner.temp }}/candidate-audit-native-pr.json
          if-no-files-found: warn
          retention-days: 30

      - name: State strictly nonpublishing audit outcome
        if: success()
        run: |
          echo 'NATIVE_PR_CANDIDATE_BYTES_AUDITED; no Publication approval, no Sigstore Release, no tag, no PUBLISH.' >> "$GITHUB_STEP_SUMMARY"
