name: PG19 installer experiment (diagnostic, dispatch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    name: Case ${{ matrix.case }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        case: [A, B, C]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run byte-verified EDB PG19 installer with case arguments
        shell: pwsh
        run: ./scripts/pg19-installer-experiment.ps1 -Case ${{ matrix.case }}
      - name: Upload debug traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pg19-case-${{ matrix.case }}-trace
          path: ${{ runner.temp }}/pg19-case${{ matrix.case }}-debugtrace.log
          if-no-files-found: ignore
