name: Issue 311 R06 real central ZIP hostile 17 source (NONPUBLISHING)
# One protected request-only merge; no schedule/dispatch/Publisher.
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261029-r06hostile17g01.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: issue311-r06-hostile17-one-shot-source
  cancel-in-progress: false
jobs:
  original:
    name: Original central ZIP bytes, 17 exact protected GET, controlled negatives, initial App CAS
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    environment: issue311-state-writer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Verify authentic central ZIP and persist nonpublishing source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r06-hostile17-live.py source
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-hostile17-original
          path: issue311-r06-hostile17-original.json
          if-no-files-found: error
          retention-days: 30
