name: Shared verified manual Windows Release promotion

# SOURCE-ONLY compatibility preparation. All deployed caller promote.yml files
# remain pinned to the historical immutable shared workflow SHA. This edit does
# not enable publication, repin the historical signer, authorize an App/Writer
# or attest original ZIP/SBOM bytes. The shared operator gate remains fail-closed.
# Reuse the tested Wave3 first-release source/policy parser and hardened current
# Publisher source from an immutable build commit; independently accept future
# deployed signer/publisher pins before any new PUBLISH-capable caller cutover.
on:
  workflow_call:
    inputs:
      candidate_pr:
        required: true
        type: string
      candidate_run_id:
        required: true
        type: string
      decision_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      confirm_release:
        required: true
        type: string
    secrets:
      catalog_app_private_key:
        required: false

concurrency:
  group: shared-human-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Verify central and local manual PUBLISH and immutable evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: dd4d35186edccfbf39b40d86cecb28380cf210da
          path: .pgextwin-build
          persist-credentials: false
      - name: Require trusted caller repository before parsing inputs
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          case "$REPO" in
            pgextwin/plpgsql_check|pgextwin/pgtap|pgextwin/pg_variables|pgextwin/pg_store_plans) ;;
            *) echo "::error::DENY unknown promotion caller: $REPO"; exit 1 ;;
          esac
      - name: Require explicit operator PUBLISH and independently VERIFIED candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          DECISION_RUN: ${{ inputs.decision_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          python .pgextwin-build/scripts/fleet-promotion-gate.py \
            --candidate-pr "$CANDIDATE_PR" \
            --candidate-run-id "$CANDIDATE_RUN" \
            --decision-run-id "$DECISION_RUN" \
            --release-tag "$RELEASE_TAG" \
            --confirm-release "$CONFIRM_RELEASE" \
            --extension config/extension.json \
            --local-policy config/release-promotion.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --output "$RUNNER_TEMP/promotion-receipt.json"
      - name: Preserve immutable authorization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt
          path: ${{ runner.temp }}/promotion-receipt.json
          if-no-files-found: error

  release_build:
    name: Rebuild signed Windows x64 binary and SBOM from verified current main
    needs: authorize
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@5756b3c5136a8bf4db710016cfe97555f0a71c6d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  publish:
    name: Check signatures, exact SHA256 and create-only Release ID
    needs: [authorize, release_build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: dd4d35186edccfbf39b40d86cecb28380cf210da
          path: .pgextwin-build
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-receipt
          path: ${{ runner.temp }}/authorization
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ github.event.repository.name }}-pg*-windows-x64
          path: dist
          merge-multiple: true
      - name: Verify signed binaries and publish only the fresh exact Release ID
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python .pgextwin-build/scripts/fleet-publish-release.py \
            --manifest config/extension.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --receipt "$RUNNER_TEMP/authorization/promotion-receipt.json" \
            --tag "$RELEASE_TAG" \
            --dist dist \
            --recovery "$RUNNER_TEMP/promotion-recovery.json"
      - name: Preserve partial-Draft recovery record, never auto-retry an occupied tag
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-recovery
          path: ${{ runner.temp }}/promotion-recovery.json
          if-no-files-found: warn

  catalog_sync:
    name: Independently propose published Release to Catalog (optional existing App)
    needs: publish
    if: ${{ vars.PGEXTWIN_CATALOG_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint catalog-only short-lived installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PGEXTWIN_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.catalog_app_private_key }}
          owner: pgextwin
          repositories: catalog
          permission-actions: write
      - name: Request independent signed Release verification and Catalog proposal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXTENSION: ${{ github.event.repository.name }}
        run: |
          gh workflow run sync-verified-release.yml --repo pgextwin/catalog --ref main \
            -f extension="$EXTENSION" -f release_tag="$RELEASE_TAG"

  catalog_not_configured:
    name: Report independent Catalog ingestion is not configured
    needs: publish
    if: ${{ vars.PGEXTWIN_CATALOG_APP_CLIENT_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Flag missing opt-in without claiming Catalog completion
        run: |
          echo "::warning::Verified Release published, Catalog integration not configured."
          echo "CATALOG_SYNC=BLOCKED_APP_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
