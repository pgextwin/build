name: Verify immutable pin Auto-merge eligibility (READ ONLY)

# Optional immutable read-only evidence checker; NO GitHub mutations or merge.
# This reusable workflow NEVER creates a Release, tag or signing authorization.
on:
  workflow_call:
    inputs:
      windows_run_id:
        required: true
        type: number
      expected_central_sha:
        required: true
        type: string

jobs:
  read-only-evidence:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'Windows CI/CD' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check out only immutable shared guard, not PR content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: .pgextwin-guard
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Inspect original PR, protected main, independent CI and exact SHA without merging
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.windows_run_id }}
          CENTRAL_SHA: ${{ inputs.expected_central_sha }}
        run: >-
          python .pgextwin-guard/scripts/verified-pin-automerge.py
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN_ID"
          --expected-central "$CENTRAL_SHA"
          --fleet .pgextwin-guard/metadata/automation-fleet.json
