name: Issue 311 R11 original legacy writer overlap GET (NONPUBLISHING)
on:
  pull_request:
    paths:
      - 'scripts/issue311-r11-overlap-preflight.py'
      - 'tests/test-issue311-r11-overlap-preflight.py'
      - '.github/workflows/issue311-r11-overlap-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue311-r11-overlap-preflight.py'
      - 'tests/test-issue311-r11-overlap-preflight.py'
      - '.github/workflows/issue311-r11-overlap-preflight.yml'
permissions:
  contents: read
  actions: read
jobs:
  hostile_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tests/test-issue311-r11-overlap-preflight.py
  original_snapshot:
    if: github.event_name == 'push' && github.repository == 'pgextwin/build' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticated active old/new Run audit at 20 repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-overlap-preflight.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r11-overlap-original-snapshot
          path: issue311-r11-overlap-snapshot.json
          retention-days: 30
          if-no-files-found: error
  independent_readback:
    needs: original_snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GET first Runner's original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name issue311-r11-overlap-original-snapshot --dir .
      - name: Download and SHA256-verify actual original Artifact ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, urllib.parse, urllib.request, zipfile
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          data = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"]))
          matches = [x for x in data["artifacts"]
                     if x.get("name") == "issue311-r11-overlap-original-snapshot"]
          assert len(matches) == 1 and data["total_count"] <= 100
          artifact = matches[0]
          assert artifact.get("expired") is False
          expected = artifact["digest"]
          assert expected.startswith("sha256:") and len(expected) == 71
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json"})
          class SecureRedirect(urllib.request.HTTPRedirectHandler):
              # Never send the original GitHub bearer token to artifact storage.
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  old = urllib.parse.urlparse(request.full_url)
                  dest = urllib.parse.urlparse(newurl)
                  assert dest.scheme == "https", "insecure artifact redirect"
                  if old.hostname != dest.hostname:
                      return urllib.request.Request(
                          newurl, headers={"User-Agent":"pgextwin-issue311-readonly-artifact"})
                  return super().redirect_request(request, fp, code, msg, headers, newurl)
          with urllib.request.build_opener(SecureRedirect()).open(req, timeout=60) as response:
              raw = response.read()
          actual = hashlib.sha256(raw).hexdigest()
          assert expected == "sha256:" + actual, "original ZIP bytes differ from digest"
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert archive.testzip() is None, "bad ZIP CRC"
              names = archive.namelist()
              assert names == ["issue311-r11-overlap-snapshot.json"], names
              assert archive.read(names[0]) == pathlib.Path(names[0]).read_bytes()
          print("R11_ORIGINAL_OUTER_ZIP_BYTES_SHA256", artifact["id"], len(raw), actual)
          print("R11_ORIGINAL_INNER_JSON_BYTES_SHA256",
                hashlib.sha256(pathlib.Path(names[0]).read_bytes()).hexdigest())
          PY
      - name: Independently GET each captured original Run identity without App key
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-overlap-preflight.py --verify
