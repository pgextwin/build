name: Build PostgreSQL extension for Windows

on:
  workflow_call:
    inputs:
      extension_config_path:
        description: Path to the extension manifest in the caller repository
        required: false
        type: string
        default: config/extension.json
      test_contract_path:
        description: Path to the Test Contract v2 document in the caller repository
        required: false
        type: string
        default: config/test-contract.json
    outputs:
      extension_name:
        description: Extension name resolved from the caller manifest
        value: ${{ jobs.matrix.outputs.extension_name }}
      upstream_repository:
        description: Upstream repository resolved from the caller manifest
        value: ${{ jobs.matrix.outputs.upstream_repository }}
      build_sha:
        description: The resolved pgextwin/build commit SHA that is running this workflow
        value: ${{ jobs.matrix.outputs.build_sha }}
      reuse_applied:
        description: Whether a successful PR Run supplied the Windows CI result
        value: ${{ jobs.matrix.outputs.reuse_applied }}
      reuse_source_pr:
        description: PR number of the reused Windows CI result
        value: ${{ jobs.matrix.outputs.reuse_source_pr }}
      reuse_source_run_id:
        description: Run ID of the reused Windows CI result
        value: ${{ jobs.matrix.outputs.reuse_source_run_id }}
      reuse_source_attempt:
        description: Attempt of the reused Windows CI result
        value: ${{ jobs.matrix.outputs.reuse_source_attempt }}
      reuse_source_build_sha:
        description: Build infrastructure SHA of the reused Windows CI result
        value: ${{ jobs.matrix.outputs.reuse_source_build_sha }}

jobs:
  matrix:
    name: Resolve extension and PostgreSQL matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      extension_name: ${{ steps.meta.outputs.extension_name }}
      upstream_repository: ${{ steps.meta.outputs.upstream_repository }}
      upstream_mode: ${{ steps.meta.outputs.upstream_mode }}
      upstream_ref: ${{ steps.meta.outputs.upstream_ref }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      verify_upstream_license: ${{ steps.meta.outputs.verify_upstream_license }}
      license_files: ${{ steps.meta.outputs.license_files }}
      build_sha: ${{ steps.build_sha.outputs.build_sha }}
      reuse_applied: ${{ steps.reuse.outputs.reuse_applied }}
      reuse_source_pr: ${{ steps.reuse.outputs.reuse_source_pr }}
      reuse_source_run_id: ${{ steps.reuse.outputs.reuse_source_run_id }}
      reuse_source_attempt: ${{ steps.reuse.outputs.reuse_source_attempt }}
      reuse_source_build_sha: ${{ steps.reuse.outputs.reuse_source_build_sha }}

    steps:
      - name: Record resolved build workflow SHA
        id: build_sha
        shell: bash
        run: echo "build_sha=${{ job.workflow_sha }}" >> "$GITHUB_OUTPUT"

      - name: Check out extension packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pgextwin build infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build

      - name: Set up Python for Test Contract validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate Test Contract v2
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
          python ".pgextwin-build/scripts/validate-test-contract.py" \
            --schema ".pgextwin-build/schema/test-contract.schema.json" \
            --contract "${{ inputs.test_contract_path }}" \
            --extension-config "${{ inputs.extension_config_path }}" \
            --repository-root "."

      - name: Resolve maintained PostgreSQL versions
        id: meta
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/resolve-matrix.ps1" `
            -ExtensionConfigPath "${{ inputs.extension_config_path }}" `
            -PostgreSqlConfigPath ".pgextwin-build/metadata/postgresql.json"

      - name: Record resolved Windows CI inputs
        id: record
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_SHA: ${{ job.workflow_sha }}
          EXTENSION_NAME: ${{ steps.meta.outputs.extension_name }}
          UPSTREAM_REPOSITORY: ${{ steps.meta.outputs.upstream_repository }}
          UPSTREAM_MODE: ${{ steps.meta.outputs.upstream_mode }}
          UPSTREAM_REF: ${{ steps.meta.outputs.upstream_ref }}
          UPSTREAM_VERSION: ${{ steps.meta.outputs.upstream_version }}
          VERIFY_UPSTREAM_LICENSE: ${{ steps.meta.outputs.verify_upstream_license }}
          LICENSE_FILES: ${{ steps.meta.outputs.license_files }}
          MATRIX: ${{ steps.meta.outputs.matrix }}
        run: |
          checkout_commit="$(git rev-parse HEAD)"
          checkout_tree="$(git rev-parse 'HEAD^{tree}')"
          line="$(CHECKOUT_COMMIT="$checkout_commit" CHECKOUT_TREE="$checkout_tree" \
            python .pgextwin-build/scripts/windows-main-reuse.py record)"
          printf '%s\n' "$line"
          printf 'record=%s\ntree=%s\n' "${line#PGEXTWIN_INPUT_RECORD=}" "$checkout_tree" >> "$GITHUB_OUTPUT"

      - name: Determine whether main can reuse Windows CI
        id: reuse
        continue-on-error: true
        shell: bash
        env:
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RECORD: ${{ steps.record.outputs.record }}
          CURRENT_TREE: ${{ steps.record.outputs.tree }}
          CURRENT_BUILD_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ "$MAIN_PUSH" != true ]]; then
            printf 'reuse_applied=false\nreuse_reason=not_main_push\n' >> "$GITHUB_OUTPUT"
          elif ! python .pgextwin-build/scripts/windows-main-reuse.py determine \
            --enabled-list .pgextwin-build/metadata/main-reuse.json \
            --current-record "$CURRENT_RECORD" --current-tree "$CURRENT_TREE" \
            --current-build-sha "$CURRENT_BUILD_SHA"; then
            printf 'reuse_applied=false\nreuse_reason=determine_failed\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: PostgreSQL ${{ matrix.major }} / Windows x64
    needs: matrix
    if: ${{ needs.matrix.outputs.reuse_applied != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - name: Check out extension packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pgextwin build infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build

      - name: Check out pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.matrix.outputs.upstream_repository }}
          ref: ${{ matrix.upstreamCommit != '' && matrix.upstreamCommit || matrix.upstreamRef }}
          path: upstream

      - name: Verify immutable pinned upstream commit
        if: matrix.upstreamCommit != ''
        shell: pwsh
        run: |
          $actual = (& git -C upstream rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne "${{ matrix.upstreamCommit }}") {
            throw "Upstream SHA mismatch: expected ${{ matrix.upstreamCommit }}, got $actual"
          }

      - name: Select Windows package route
        id: package_route
        shell: pwsh
        run: |
          $common = Test-Path -LiteralPath "windows/ci/package.json"
          "common=$($common.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($common) {
            $work = [IO.Directory]::CreateTempSubdirectory('pgextwin-package-').FullName
            "work=$work" >> $env:GITHUB_OUTPUT
          }

      - name: Verify upstream license files match packaging repository
        if: steps.package_route.outputs.common == 'false' && needs.matrix.outputs.verify_upstream_license == 'true'
        shell: pwsh
        env:
          PGEXTWIN_LICENSE_FILES: ${{ toJSON(matrix.licenseFiles) }}
        run: |
          $licenseConfig = New-TemporaryFile
          try {
            Set-Content -LiteralPath $licenseConfig.FullName -Value $env:PGEXTWIN_LICENSE_FILES -Encoding utf8NoBOM -NoNewline
            # Existing package hooks copy licenses from the checkouts.
            python ".pgextwin-build/scripts/verify-license-bytes.py" `
              --license-files $licenseConfig.FullName `
              --upstream-dir "upstream" `
              --packaging-dir "." `
              --stage-dir ".pgextwin-verified-licenses" `
              --restore-worktrees
            if ($LASTEXITCODE -ne 0) { throw "Upstream license byte verification failed." }
          } finally {
            Remove-Item -LiteralPath $licenseConfig.FullName
          }

      - name: Install PostgreSQL ${{ matrix.major }}
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/install-postgresql.ps1" `
            -Major ([int]"${{ matrix.major }}") `
            -ChocolateyPackage "${{ matrix.chocolateyPackage }}" `
            -ChocolateyVersion "${{ matrix.chocolateyVersion }}" `
            -TestPort ([int]"${{ matrix.testPort }}")

      - name: Build extension
        if: steps.package_route.outputs.common == 'false'
        shell: pwsh
        run: |
          & ".\\windows\\ci\\build.ps1" `
            -PgRoot $env:PGROOT `
            -UpstreamDir (Join-Path $PWD "upstream")

      - name: Install extension into test PostgreSQL
        if: steps.package_route.outputs.common == 'false'
        shell: pwsh
        run: |
          & ".\\windows\\ci\\install.ps1" `
            -PgRoot $env:PGROOT `
            -UpstreamDir (Join-Path $PWD "upstream")

      - name: Functional smoke test
        if: steps.package_route.outputs.common == 'false'
        shell: pwsh
        run: |
          & ".\\windows\\ci\\smoke-test.ps1" `
            -PgRoot $env:PGROOT `
            -PgPort ([int]$env:PGPORT) `
            -PostgreSqlMajor ([int]"${{ matrix.major }}")

      - name: Package Windows binary
        if: steps.package_route.outputs.common == 'false'
        shell: pwsh
        run: |
          & ".\\windows\\ci\\package.ps1" `
            -UpstreamDir (Join-Path $PWD "upstream") `
            -UpstreamRepository "${{ needs.matrix.outputs.upstream_repository }}" `
            -UpstreamRef "${{ matrix.upstreamRef }}" `
            -UpstreamVersion "${{ matrix.upstreamVersion }}" `
            -PostgreSqlMajor ([int]"${{ matrix.major }}") `
            -PostgreSqlMinor "${{ matrix.minor }}"

      - name: Finalize legacy package metadata
        if: steps.package_route.outputs.common == 'false'
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/finalize-package.ps1" -ExtensionName "${{ needs.matrix.outputs.extension_name }}" -UpstreamDir (Join-Path $PWD "upstream") -UpstreamRepository "${{ needs.matrix.outputs.upstream_repository }}" -UpstreamRef "${{ matrix.upstreamRef }}" -UpstreamVersion "${{ matrix.upstreamVersion }}" -PostgreSqlMajor ([int]"${{ matrix.major }}") -PostgreSqlTestedVersion "${{ matrix.minor }}" -ChocolateyPackage "${{ matrix.chocolateyPackage }}" -ChocolateyPackageVersion "${{ matrix.chocolateyVersion }}" -PackagingRepository "${{ github.repository }}" -BuildRepository "${{ job.workflow_repository }}" -BuildCommit "${{ job.workflow_sha }}" -ReusableWorkflow ".github/workflows/build-extension.yml" -BuildMode "normal" -WorkflowRunId ([long]"${{ github.run_id }}") -WorkflowRunAttempt ([int]"${{ github.run_attempt }}") -WorkflowRunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -WorkflowEvent "${{ github.event_name }}" -WorkflowRef "${{ github.ref }}"

      - name: Prepare placement map package and run smoke test
        if: steps.package_route.outputs.common == 'true'
        shell: pwsh
        env:
          MATRIX_ROW: ${{ toJSON(matrix) }}
          EXTENSION_NAME: ${{ needs.matrix.outputs.extension_name }}
          UPSTREAM_REPOSITORY: ${{ needs.matrix.outputs.upstream_repository }}
          VERIFY_LICENSE: ${{ needs.matrix.outputs.verify_upstream_license }}
          BUILD_REPOSITORY: ${{ job.workflow_repository }}
          BUILD_SHA: ${{ job.workflow_sha }}
          PACKAGE_WORK: ${{ steps.package_route.outputs.work }}
        run: |
          & ".pgextwin-build/scripts/invoke-windows-package.ps1" `
            -Action Prepare -WorkDir $env:PACKAGE_WORK -MatrixJson $env:MATRIX_ROW `
            -ExtensionName $env:EXTENSION_NAME -UpstreamRepository $env:UPSTREAM_REPOSITORY `
            -BuildRepository $env:BUILD_REPOSITORY -BuildCommit $env:BUILD_SHA -BuildMode normal `
            -VerifyLicense:($env:VERIFY_LICENSE -eq 'true')

      - name: Finalize placement map package
        if: steps.package_route.outputs.common == 'true'
        shell: pwsh
        env:
          MATRIX_ROW: ${{ toJSON(matrix) }}
          EXTENSION_NAME: ${{ needs.matrix.outputs.extension_name }}
          UPSTREAM_REPOSITORY: ${{ needs.matrix.outputs.upstream_repository }}
          VERIFY_LICENSE: ${{ needs.matrix.outputs.verify_upstream_license }}
          BUILD_REPOSITORY: ${{ job.workflow_repository }}
          BUILD_SHA: ${{ job.workflow_sha }}
          PACKAGE_WORK: ${{ steps.package_route.outputs.work }}
        run: |
          & ".pgextwin-build/scripts/invoke-windows-package.ps1" `
            -Action Finalize -WorkDir $env:PACKAGE_WORK -MatrixJson $env:MATRIX_ROW `
            -ExtensionName $env:EXTENSION_NAME -UpstreamRepository $env:UPSTREAM_REPOSITORY `
            -BuildRepository $env:BUILD_REPOSITORY -BuildCommit $env:BUILD_SHA -BuildMode normal `
            -VerifyLicense:($env:VERIFY_LICENSE -eq 'true')

      - name: Validate final package metadata
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the package metadata schema validator." }

          $zipFiles = @(Get-ChildItem -Path "dist" -Filter "*.zip" -File)
          if ($zipFiles.Count -ne 1) { throw "Expected exactly one final ZIP for metadata validation, found $($zipFiles.Count)." }
          python ".pgextwin-build/scripts/validate-package-metadata.py" --schema ".pgextwin-build/schema/package-info.schema.json" --zip $zipFiles[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Final PACKAGE-INFO.json schema validation failed." }

      - name: Install checksum-pinned Syft
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/install-syft.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Syft installation failed." }

      - name: Generate SPDX 2.3 SBOM
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/generate-sbom.ps1" `
            -SyftPath (Join-Path $PWD ".pgextwin-tools\syft\syft.exe") `
            -ExtensionName "${{ needs.matrix.outputs.extension_name }}" `
            -ExtensionVersion "${{ matrix.upstreamVersion }}"
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed." }

      - name: Validate SPDX 2.3 SBOM
        shell: pwsh
        run: |
          $zipFiles = @(Get-ChildItem -Path "dist" -Filter "*.zip" -File)
          $sbomFiles = @(Get-ChildItem -Path "dist" -Filter "*.spdx.json" -File)
          if ($zipFiles.Count -ne 1) { throw "Expected exactly one final ZIP for SBOM validation, found $($zipFiles.Count)." }
          if ($sbomFiles.Count -ne 1) { throw "Expected exactly one SPDX JSON for SBOM validation, found $($sbomFiles.Count)." }

          python ".pgextwin-build/scripts/validate-sbom.py" `
            --sbom $sbomFiles[0].FullName `
            --zip $zipFiles[0].FullName `
            --expected-extension "${{ needs.matrix.outputs.extension_name }}" `
            --expected-version "${{ matrix.upstreamVersion }}" `
            --expected-tool-version "1.54.1"
          if ($LASTEXITCODE -ne 0) { throw "SPDX SBOM validation failed." }

      # E3 PR5 (audit M1): Grype is diagnostic only in this build. Its
      # installation or scan failure must not stop the artifact upload;
      # the step after the scan materializes a diagnostic record in the
      # report slot so the asset set stays identical to a successful scan.
      - name: Install checksum-pinned Grype
        id: grype_install
        continue-on-error: true
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/install-grype.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Grype installation failed." }

      - name: Scan validated SPDX SBOM for known vulnerabilities
        id: grype_scan
        if: steps.grype_install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & ".pgextwin-build/scripts/scan-vulnerabilities.ps1" `
            -GrypePath ".pgextwin-tools\grype\grype.exe"
          if ($LASTEXITCODE -ne 0) { throw "Vulnerability scan failed operationally." }

      - name: Record vulnerability diagnostic when no report was produced
        shell: pwsh
        env:
          GRYPE_INSTALL_OUTCOME: ${{ steps.grype_install.outcome }}
          GRYPE_SCAN_OUTCOME: ${{ steps.grype_scan.outcome }}
        run: |
          python ".pgextwin-build/scripts/grype-diagnostic-record.py" `
            --dist "dist" `
            --install-outcome $env:GRYPE_INSTALL_OUTCOME `
            --scan-outcome $env:GRYPE_SCAN_OUTCOME `
            --expected-scanner-version "0.120.1" `
            --summary-file $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Failed to record the vulnerability diagnostic state." }

      - name: Validate and summarize vulnerability report
        shell: pwsh
        run: |
          $zipFiles = @(Get-ChildItem -Path "dist" -Filter "*.zip" -File)
          $sbomFiles = @(Get-ChildItem -Path "dist" -Filter "*.spdx.json" -File)
          $reportFiles = @(Get-ChildItem -Path "dist" -Filter "*.vulnerabilities.json" -File)
          if ($zipFiles.Count -ne 1) { throw "Expected exactly one final ZIP for vulnerability validation, found $($zipFiles.Count)." }
          if ($sbomFiles.Count -ne 1) { throw "Expected exactly one SPDX JSON for vulnerability validation, found $($sbomFiles.Count)." }
          if ($reportFiles.Count -ne 1) { throw "Expected exactly one vulnerability JSON for validation, found $($reportFiles.Count)." }

          python ".pgextwin-build/scripts/validate-vulnerability-report.py" `
            --report $reportFiles[0].FullName `
            --sbom $sbomFiles[0].FullName `
            --zip $zipFiles[0].FullName `
            --expected-extension "${{ needs.matrix.outputs.extension_name }}" `
            --expected-scanner-version "0.120.1" `
            --postgresql-major "${{ matrix.major }}" `
            --summary-file $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Vulnerability report validation failed." }
      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.matrix.outputs.extension_name }}-pg${{ matrix.major }}-windows-x64
          path: |
            dist/*.zip
            dist/*.spdx.json
            dist/*.vulnerabilities.json
          if-no-files-found: error
