name: Publish PostgreSQL extension Windows release

on:
  workflow_call:
    inputs:
      extension_name:
        description: Extension name resolved by the build workflow
        required: true
        type: string
      upstream_repository:
        description: Upstream repository used for release documentation
        required: true
        type: string

jobs:
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.extension_name }}-pg*-windows-x64
          path: dist
          merge-multiple: true

      - name: Create checksums and bilingual release notes
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          mapfile -t release_assets < <(printf '%s\n' ./*.zip ./*.spdx.json ./*.vulnerabilities.json | LC_ALL=C sort)
          sha256sum "${release_assets[@]}" > SHA256SUMS.txt
          cd ..

          tag="${GITHUB_REF_NAME#release/}"
          extension="${{ inputs.extension_name }}"
          upstream_repo="${{ inputs.upstream_repository }}"

          cat > release-notes.md <<EOF
          # ${extension} Windows x64 binaries

          ## English

          These are **unofficial Windows x64 binaries** of [${extension}](https://github.com/${upstream_repo}), built from pinned upstream source references defined by this repository's manifest. \`PACKAGE-INFO.txt\` is the human-readable package summary, while \`PACKAGE-INFO.json\` is the machine-readable source/build identity.

          Every ZIP is compiled and functionally smoke-tested on GitHub Actions against the PostgreSQL major version in its filename. The build matrix includes only PostgreSQL versions that are both allowed by this extension's manifest and still under PostgreSQL community maintenance.

          ### Documentation

          - [English README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)
          - [Japanese README / 日本語README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README_ja.md)
          - [Upstream repository](https://github.com/${upstream_repo})

          For extension behavior, SQL APIs, configuration, limitations, and licensing, the upstream project remains authoritative.

          ### Package metadata and verification

          - \`PACKAGE-INFO.txt\`: human-readable compatibility summary and extension-specific notes inside each ZIP.
          - \`PACKAGE-INFO.json\`: machine-readable package, upstream, packaging-repository, shared-build, PostgreSQL, toolchain, runner, and workflow-run identity inside each ZIP.
          - \`<zip-basename>.spdx.json\`: SPDX 2.3 SBOM generated by Syft from the final ZIP.
          - \`<zip-basename>.vulnerabilities.json\`: Grype report-only analysis of that SBOM against the vulnerability database available at release-build time. This is a point-in-time result and is not guaranteed to remain current.
          - \`SHA256SUMS.txt\`: external SHA-256 digest list for the published ZIPs, SPDX JSON files, and vulnerability JSON reports.
          - Build Provenance Attestation: signed evidence of which pinned workflow built the final ZIP.
          - SBOM Attestation: signed binding between the final ZIP digest and its SPDX 2.3 SBOM.

          \`PACKAGE-INFO.json\` does not contain the ZIP's own SHA-256 or an Attestation ID/URL. Those values are intentionally external so the final ZIP can be attested without a digest cycle.

          ### File verification

          Use the attached \`SHA256SUMS.txt\` to verify each ZIP.

          ### Build provenance

          ZIPs built by the Step 6 release build path have a GitHub Artifact Attestation generated by the pinned \`pgextwin/build\` reusable workflow. Verify a downloaded ZIP with GitHub CLI:

          \`\`\`bash
          gh attestation verify <zip-file> \\
            --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow pgextwin/build/.github/workflows/build-extension-attested.yml
          \`\`\`

          ### SBOM attestation

          Verify the signed binding between the same ZIP digest and its SPDX 2.3 SBOM:

          \`\`\`bash
          gh attestation verify <zip-file> \\
            --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow pgextwin/build/.github/workflows/build-extension-attested.yml \\
            --predicate-type https://spdx.dev/Document/v2.3
          \`\`\`

          The standalone \`*.spdx.json\` file is also published for inspection and offline tooling. A vulnerability report with zero matches means only that no known vulnerability matched packages represented in that SBOM and the scan-time database; it does not prove the binary is vulnerability-free. Historical releases are not modified retroactively.

          ---

          ## 日本語

          [${extension}](https://github.com/${upstream_repo}) の **非公式 Windows x64 バイナリ**です。このrepositoryのmanifestで固定したupstreamソースからビルドしています。\`PACKAGE-INFO.txt\` は人間向けpackage summary、\`PACKAGE-INFO.json\` は機械可読なsource/build identityです。

          各ZIPは、ファイル名に記載されたPostgreSQLメジャーバージョンに対してGitHub Actions上でコンパイルし、Extension固有の機能スモークテストまで実施しています。対象は、そのExtensionのmanifestで許可され、かつPostgreSQLコミュニティのメンテナンス期間内にあるバージョンのみです。

          ### ドキュメント

          - [日本語README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README_ja.md)
          - [English README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)
          - [Upstream repository / 公式リポジトリ](https://github.com/${upstream_repo})

          Extension本体の機能仕様、SQL API、設定、制限事項、ライセンスについてはupstreamプロジェクトを正規の情報源としてください。

          ### Package metadataと検証

          - \`PACKAGE-INFO.txt\`: ZIP内部の人間向け互換性summary・Extension固有注意事項。
          - \`PACKAGE-INFO.json\`: ZIP内部の機械可読なpackage / upstream / packaging repository / shared build / PostgreSQL / toolchain / runner / workflow run identity。
          - \`<zip-basename>.spdx.json\`: final ZIPをSyftでscanして生成するSPDX 2.3 SBOM。
          - \`<zip-basename>.vulnerabilities.json\`: そのSBOMをRelease build時点の脆弱性DBと照合したGrypeのreport-only分析結果。point-in-time resultであり、継続的に最新である保証はありません。
          - \`SHA256SUMS.txt\`: 公開ZIP、SPDX JSON、vulnerability JSONのdownload integrity確認用SHA-256 digest一覧。
          - Build Provenance Attestation: どのpin済みworkflowがfinal ZIPをbuildしたかを示す署名付きevidence。
          - SBOM Attestation: final ZIP digestとSPDX 2.3 SBOMを署名付きで結び付けるevidence。

          \`PACKAGE-INFO.json\` にはZIP自身のSHA-256やAttestation ID/URLを入れません。final ZIPを変更せずAttestation対象にできるよう、これらは意図的に外部へ分離しています。

          ### ファイル検証

          Releaseに添付した \`SHA256SUMS.txt\` で各ZIPのSHA-256を確認できます。

          ### ビルドProvenance

          Step 6導入後のrelease build pathで生成したZIPには、full SHAへpinされた \`pgextwin/build\` Reusable WorkflowがGitHub Artifact Attestationを生成します。ダウンロードしたZIPはGitHub CLIで検証できます。

          \`\`\`bash
          gh attestation verify <zip-file> \\
            --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow pgextwin/build/.github/workflows/build-extension-attested.yml
          \`\`\`

          ### SBOM Attestation

          同じZIP digestとSPDX 2.3 SBOMの署名付きbindingを検証します。

          \`\`\`bash
          gh attestation verify <zip-file> \\
            --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow pgextwin/build/.github/workflows/build-extension-attested.yml \\
            --predicate-type https://spdx.dev/Document/v2.3
          \`\`\`

          \`*.spdx.json\` は人間による確認やoffline tool利用向けにも独立assetとして公開します。vulnerability reportが0件でも「SBOMに表現されたpackageとscan時点DBに既知脆弱性matchがなかった」という意味に限定され、バイナリの安全性証明ではありません。既存のhistorical Releaseは変更しません。
          EOF

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md

            gh release upload "$RELEASE_TAG" \
              dist/*.zip \
              dist/*.spdx.json \
              dist/*.vulnerabilities.json \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.zip \
              dist/*.spdx.json \
              dist/*.vulnerabilities.json \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
