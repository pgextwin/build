name: Issue 311 R06 original hostile terminal recovery (NONPUBLISHING)
# One protected request-only push, distinct from the original successful source.
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261029-r06hostile17-recover01.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: issue311-r06-hostile17-original-recovery
  cancel-in-progress: false
jobs:
  recover:
    name: Exact original source ZIP GET, independent scoped CAS terminal, replay DENY
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    environment: issue311-state-writer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Independently authenticate original failed completion and persist nonpublishing terminal
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r06-hostile17-live.py recover
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-hostile17-durable-replay-recovered
          path: issue311-r06-hostile17-durable-replay.json
          if-no-files-found: error
          retention-days: 30
