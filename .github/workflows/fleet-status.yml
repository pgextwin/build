name: Aggregate fleet automation status

on:
  push:
    branches:
      - main
    paths:
      - metadata/automation-fleet.json
      - scripts/fleet-status.py
      - .github/workflows/fleet-status.yml
  schedule:
    # An observation window after 00:00 UTC; not a guarantee watches have completed.
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Read GitHub state without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fleet-status.py \
            --policy metadata/automation-fleet.json \
            --lifecycle metadata/postgresql.json \
            --json "$RUNNER_TEMP/fleet-status.json" \
            --markdown "$RUNNER_TEMP/fleet-status.md"
          cat "$RUNNER_TEMP/fleet-status.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JSON and Markdown state snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-status
          path: |
            ${{ runner.temp }}/fleet-status.json
            ${{ runner.temp }}/fleet-status.md
          if-no-files-found: error
