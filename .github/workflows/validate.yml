name: Validate build infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reject unsigned, skipped and stale remote candidate Runs (NO RELEASE)
        run: python tests/test-publisher-candidate-intake.py

      - name: Verify reusable single-repository token revocation and isolation (NO RELEASE)
        run: python tests/test-publisher-scoped-token.py

      - name: Test nonpublishing Publisher App proof without credentials
        run: python tests/test-probe-publisher-app.py

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Validate Issue 311 request scope and deny untrusted publication claims (NO RELEASE)
        run: python tests/test-issue311-request-contract.py

      - name: Validate GitHub Actions trust policy
        run: python tests/test-github-actions-security.py

      - name: Validate PG14-18 minimal EDB install arguments and fail-closed retry
        run: python tests/test-postgresql-minimal-install.py

      - name: Validate five-major Chocolatey selected-components real-test-only path
        run: python tests/test-postgresql-component-only.py

      - name: Validate PG14-18 read-only EDB phase timing fixtures
        run: python tests/test-edb-install-timing.py

      - name: Validate update watch fixtures
        run: python tests/test-update-watch.py

      - name: Validate shared 17-extension operator UPDATE and read-only security gate
        run: python tests/test-operator-update-readonly.py

      - name: Validate Step 19 candidate update fixtures
        run: python tests/test-candidate-update.py

      - name: Reject forged candidate base-sync repairs before bot commit (NONPUBLISHING)
        run: python tests/test-bot-candidate-base-sync.py

      - name: Deny forged Wave3 failed-candidate recovery and preserve original attempts
        run: python tests/test-first-release-recovery.py

      - name: Verify first-release intent and deny forged candidate/promotion
        run: python tests/test-first-release-candidate.py

      - name: Validate Step 21 verified promotion denial fixtures
        run: python tests/test-promotion-gate.py

      - name: Validate Step 21 create-only formal publisher denial fixtures
        run: python tests/test-publish-release.py

      - name: Validate heterogeneous 14-extension manual Release identities
        run: python tests/test-fleet-release-identity.py

      - name: Validate 14-extension manual promotion candidate authorization
        run: python tests/test-fleet-promotion-gate.py

      - name: Validate 17-caller shared Promotion and 13 legacy source parity (nonpublishing)
        run: python tests/test-shared-manual-promotion.py

      - name: Deny tainted ZIP/SPDX/Grype bytes before frozen legacy Publisher
        run: python tests/test-formal-publisher-grype-preflight.py

      - name: Validate 17-extension hourly Chat task queue and nonpublishing policy
        run: python tests/test-chat-task-queue.py

      - name: Validate inert Chat PR authorization and hostile merge/event fixtures
        run: python tests/test-chat-pr-authorization.py

      - name: Reject forged or unverified shared-pin native Auto-merge admission
        run: python tests/test-verified-pin-automerge.py

      - name: Reject mismatched protected candidate and upstream signing intent (NONPUBLISHING)
        run: python tests/test-automatic-signed-build-intent.py
      - name: Reject forged original scheduled decision bytes on protected main (NONPUBLISHING)
        run: python tests/test-automatic-signed-build-intent-live.py
      - name: Verify common Contents transport and reject corrupt manifest bytes (NO RELEASE)
        run: python tests/test-github-contents.py
      - name: Exercise real immutable GitHub Contents wrapping and Git blob SHA (READ ONLY)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/metadata/automation-fleet.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/contents-response.json"
          python - "$RUNNER_TEMP/contents-response.json" <<'PY'
          import json,sys
          from scripts.github_contents import decode_json_file
          source=json.load(open(sys.argv[1],encoding="utf-8"))
          value=decode_json_file(source,"metadata/automation-fleet.json")
          assert value["schemaVersion"]==1 and isinstance(value["entries"],list)
          print("REAL_IMMUTABLE_CONTENTS_DECODE_AND_GIT_BLOB_SHA_VERIFIED; NO_PUBLICATION_AUTHORITY")
          PY
      - name: Reject unsigned candidate Signer output shortcuts (NO PUBLISH)
        run: python tests/test-automatic-signed-build-intent-output.py

      - name: Verify signed automatic candidate digest/Sigstore origin denial fixtures
        run: python tests/test-automatic-signed-candidate-audit.py

      - name: Deny forged cross-job Sigstore Publisher second opinion (NO PUBLISH)
        run: python tests/test-independent-signed-publisher-preflight.py

      - name: Independently reject Publisher WRITE scope for unauthorized App, repo and policy
        run: |
          python tests/test-independent-publisher-write-scope.py
          python scripts/automatic-publisher-readiness.py --fleet metadata/automation-fleet.json --central-policy metadata/release-promotion.json --unattended metadata/unattended-publication.json --publisher-boundary metadata/publisher-write-boundary.json

      - name: Deny forged signed automatic Publisher/tag handoff without releasing
        run: python tests/test-automatic-publisher-handoff.py

      - name: Deny forged live Publisher original Run/main/tag/policy rechecks
        run: python tests/test-automatic-publisher-live-preflight.py

      - name: Block unfiltered Grype high/critical/unknown findings before unattended Publisher
        run: python tests/test-automatic-grype-publisher-policy.py

      - name: Verify actual signed-audit to Publisher admission remains DENY
        run: python tests/test-automatic-publisher-bridge.py

      - name: Verify automatic read-only tag proposal cannot bypass formal Publisher gate
        run: python tests/test-automatic-release-tag-plan.py

      - name: Reject forged unattended Release requests (nonpublishing Issue 75)
        run: python tests/test-automatic-release-preflight.py

      - name: Verify native authenticated main-push candidate provenance denies forgeries
        run: python tests/test-automatic-candidate-merge-observer.py

      - name: Verify backward-compatible dispatched candidate and new immutable PR candidate ZIP audits
        run: |
          python tests/test-verify-candidate.py
          python tests/test-pr-candidate-artifacts.py
          python tests/test-native-pr-candidate-audit.py
          python tests/test-native-required-check.py
          python tests/test-recover-native-pr-candidate.py
          python tests/test-recover-native-pr-fleet.py

      - name: Reject forged merged-bot requalification origin and unsigned shortcuts (NO RELEASE)
        run: python tests/test-merged-candidate-requalification.py
      - name: Reject fake local schedule and unsigned merged-bot signing shortcuts (NO RELEASE)
        run: python tests/test-merged-schedule-signing-intent.py
      - name: Reject forged scheduled OIDC/Sigstore ZIP, event and signing source (NO RELEASE)
        run: python tests/test-audit-merged-scheduled-signed-candidate.py
      - name: Reject mismatched independent scheduled OIDC auditors and source kinds (NO RELEASE)
        run: python tests/test-join-merged-scheduled-oidc-audits.py
      - name: Reject forged original signed-schedule jobs or manual source-kind promotion (NO RELEASE)
        run: python tests/test-merged-scheduled-source-jobs.py
      - name: Reject malformed reusable scheduled OIDC Workflow syntax
        run: python tests/test-merged-schedule-workflow-syntax.py

      - name: Deny forged cross-run native candidate audit evidence before signing
        run: python tests/test-bind-native-candidate-audit.py

      - name: Reject forged live GitHub Run, PR and real downloaded audit bytes
        run: python tests/test-bind-native-candidate-audit-live.py

      - name: Reject invalid protected merge to native audit links before signed release
        run: python tests/test-automatic-postmerge-audit-bridge.py

      - name: Reject forged protected-main native audit event/release evidence
        run: |
          python tests/test-automatic-postmerge-audit-live.py
          python tests/test-central-native-schedule-postmerge.py

      - name: Verify synthetic-only same-process Publisher integration and revocation (NO RELEASE)
        run: python tests/test-automatic-publisher-inprocess-e2e.py

      - name: Reject forged scheduled Publisher runtime and original signed-source downloads
        run: python tests/test-automatic-publisher-runtime.py

      - name: Reject forged signed schedule Publisher receipts and privileged policy bypass
        run: python tests/test-automatic-publisher-receipt-issuer.py

      - name: Reject fake automatic signed Publisher public Release provenance (NO RELEASE)
        run: python tests/test-automatic-release-provenance.py

      - name: Validate typed publication receipts and event isolation
        run: python tests/test-release-authorization.py

      - name: Validate registered publication policy bundle and fail-closed controls
        run: python tests/test-fleet-promotion-policy.py

      - name: Reject partial activation and run Python CI on a nonpublishing future-policy copy
        run: python tests/test-publication-policy-transition.py

      - name: Verify migration templates, head consistency and preserved signer/protection gates (NO APPLY)
        run: python tests/test-publication-migration-plan.py

      - name: Validate PRE-G4 run attempt and certificate provenance boundary (offline only)
        run: python tests/test-issue-75-attempt-provenance-readonly.py

      - name: Validate PRE-G4 inert Publisher attempt and pin migration adversarial contract
        run: python tests/test-issue-75-attempt-pin-migration-offline.py

      - name: Validate 14-extension ID-scoped attested publisher denial fixtures
        run: python tests/test-fleet-publish-release.py

      - name: Validate PRE-G4 main Publisher active-manual fail-closed guards (offline only)
        run: python tests/test-issue-75-main-publisher-guard.py

      - name: Reject replayed, forged, cross-run completed signed push before auto Publisher
        run: python tests/test-publisher-completed-run.py

      - name: Verify independent real signed-source gate remains read-only and fail-closed
        run: python tests/test-verify-completed-signed-source.py

      - name: Reject forged schedule-signed source joins before Publisher admission (NO RELEASE)
        run: python tests/test-automatic-publisher-admission.py

      - name: Verify actual original signed main push job chain
        run: python tests/test-signed-source-jobs.py

      - name: Verify hourly Publisher selects only genuine fleet signed runs (NO RELEASE)
        run: |
          python tests/test-select-signed-publisher-candidates.py
          python tests/test-select-verified-publisher-candidates.py

      - name: Validate default-denied manual and automatic Catalog policy contracts
        run: python tests/test-manual-release-downstream.py

      - name: Validate authenticated connected-Chat and dedicated Catalog identities
        run: python tests/test-explicit-merge-identities.py

      - name: Validate Step 22 unattended publication safety contract
        run: |
          python tests/test-unattended-policy.py
          python scripts/unattended-policy.py --policy metadata/unattended-publication.json --fleet metadata/automation-fleet.json

      - name: Validate Step 20 fleet policy fixtures
        run: python tests/test-fleet-control.py

      - name: Validate Step 20 candidate artifact fixtures
        run: python tests/test-verify-candidate.py

      - name: Validate Step 20 aggregated fleet status fixtures
        run: python tests/test-fleet-status.py

      - name: Validate daily 17-extension stable upstream audit (GET only)
        run: python tests/test-fleet-upstream-watch.py

      - name: Deny forged scheduled candidate snapshots and preserve manual PUBLISH
        run: python tests/test-scheduled-fleet-candidate.py

      - name: Validate extension manifest schema
        run: python tests/test-extension-schema.py

      - name: Validate Test Contract v2 schema and semantics
        run: python tests/test-test-contract.py

      - name: Validate package metadata schema
        run: python tests/test-package-metadata-schema.py

      - name: Validate SBOM contract
        run: python tests/test-sbom-validation.py

      - name: Validate vulnerability report contract
        run: python tests/test-vulnerability-report.py

      - name: Test package metadata finalizer
        shell: pwsh
        run: ./tests/test-package-metadata-finalizer.ps1

      - name: Validate PostgreSQL lifecycle and readiness metadata
        shell: pwsh
        run: |
          ./tests/test-postgresql-metadata.ps1
          ./tests/test-postgresql-metadata.ps1 -PostgreSqlConfigPath ./tests/fixtures/postgresql-pg19-readiness.json

      - name: Test matrix resolver
        shell: pwsh
        run: ./tests/test-resolve-matrix.ps1
