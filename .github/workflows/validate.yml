  extension-ci:
    name: Selective extension CI (${{ matrix.extension }})
    needs: resolver
    # F21-02 launch wiring (B2-SOL-M1): consume the router's launch
    # matrix through the resolver job outputs and call the reusable
    # per-extension workflow once per launchable target extension.
    # The router only marks a target launchable while its packaging
    # subtree extensions/<name>/ is present in the tree; the subtrees
    # land with the F2-2 pilot migrations and the F3a waves, so until
    # then this job is skipped -- safely, after the required resolver
    # check has concluded -- instead of calling the reusable workflow
    # against content that is not in the monorepo yet.  The reusable
    # workflow's own contract is caller-root based (it checks out the
    # caller repository and resolves the package route and legacy
    # scripts relative to that root), so the per-subtree launch also
    # presumes the caller-side adaptation that belongs to the F2-2
    # migration step; what this job fixes now is the launch contract
    # itself -- job outputs, the fromJSON matrix, the per-extension
    # concurrency group -- that the adaptation plugs into.  Live
    # Check Runs confirmation stays with F2-2 / F2-3 (CB-73).
    #
    # The with: paths follow the PR-B1 single-layout contract for the
    # central monorepo (extensions/<name>/extension.json and
    # extensions/<name>/tests/test-contract.json); the legacy per-repo
    # config/ hierarchy is not part of that layout and the reusable
    # workflow resolves these paths relative to the caller root
    # (fix round 3, B2R3-M1).  The concurrency group renders the
    # router contract templates per event: pr-validation
    # (ci-<extension>-pr-<number>) for pull requests, postmerge
    # (postmerge-<extension>) for main pushes and dispatches
    # (fix round 3, B2R3-N1).
    if: ${{ needs.resolver.outputs.has_launch_targets == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', matrix.extension, github.event.pull_request.number) || format('postmerge-{0}', matrix.extension) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolver.outputs.launch_matrix) }}
    uses: ./.github/workflows/build-extension.yml
    with:
      extension_config_path: extensions/${{ matrix.extension }}/extension.json
      test_contract_path: extensions/${{ matrix.extension }}/tests/test-contract.json

  windows-package-contract:
    name: Windows package contract
    runs-on: windows-latest
    steps:
      - name: Check out build infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Windows placement and package contract
        shell: pwsh
        run: ./tests/test-windows-package.ps1

      - name: Upload placement contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-contract
          path: windows-package-contract.json
          if-no-files-found: error

  signed-package-route-regression:
    name: Offline signed package route regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed route pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test original source, signer, downloaded bytes and admission without signing
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          bash tests/run-signed-package-route-regression.sh 2>&1 | tee signed-route-regression.txt

      - name: Upload offline route evidence
        if: always()
