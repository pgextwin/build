        run: python -m unittest -v tests/test-central-extension-declaration.py

      - name: Validate central packaging and K2/K4 verification foundation (F21-04)
        run: python -m unittest -v tests/test-central-package-foundation.py

      - name: Validate selective CI router and concurrency contract (F21-02)
        run: python -m unittest -v tests/test-ci-router.py

      - name: Route selective CI targets for this change (F21-02)
        id: route
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -uo pipefail
          files_json="$RUNNER_TEMP/ci-router-files.json"
          fallback=0
          # B2-SOL-R2-M1: pin the change list to the commits this run
          # is about.  A re-run reuses the original event payload --
          # the GITHUB_SHA checkout and the base/head SHAs below --
          # while a file list fetched by pull-request number
          # describes the pull request's *current* state, so an old
          # checkout could be paired with a newer list and, when the
          # file counts happen to match, a landed change would
          # silently drop out of the routing.  The list is therefore
          # computed locally from the event's own base/head commits
          # (no API file list, so no API truncation cap either); the
          # payload count cross-check stays as a second guard, and
          # anything that cannot be pinned falls back to the safety
          # side instead of routing an untrusted list.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base_sha="$BEFORE_SHA"
            head_sha="$GITHUB_SHA"
          else
            base_sha=""
            head_sha=""
          fi
          zero_sha="0000000000000000000000000000000000000000"
          if [ -z "$base_sha" ] || [ -z "$head_sha" ] \
            || [ "$base_sha" = "$zero_sha" ] || [ "$head_sha" = "$zero_sha" ]; then
            # workflow_dispatch and any other event carry no pinned
            # change list to route.  Never present that as an empty
            # change (that would equate "unknown" with "no targets");
            # fall back to the safety side instead (DESIGN 2.1, B2-M3).
            fallback=1
          else
            name_status="$RUNNER_TEMP/ci-router-name-status.bin"
            if ! git fetch --no-tags origin "$base_sha" "$head_sha"; then
              fallback=1
            elif ! git diff --name-status -z -M -C "$base_sha...$head_sha" > "$name_status"; then
              fallback=1
            elif ! python3 scripts/ci-router.py --name-status "$name_status" > "$files_json"; then
              fallback=1
            elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
              && [ -n "$PR_CHANGED_FILES" ] \
              && [ "$(jq 'length' "$files_json")" != "$PR_CHANGED_FILES" ]; then
              # The pinned diff must describe exactly the change the
              # event payload announces; a count mismatch means the
              # list cannot be trusted as complete (B2-M3 guard).
              fallback=1
            fi
          fi
          if [ "$fallback" = "1" ] || [ ! -s "$files_json" ]; then
            # Extraction failure falls back to the safety side (all
            # registered extensions) instead of stalling the check
            # (DESIGN 2.1: extraction failure is handled explicitly).
            echo '[{"filename":"unclassified-fallback","status":"added"}]' > "$files_json"
            echo "::warning::ci-router: changed-file list unavailable; routing the safety-side fallback"
          fi
          if ! python3 scripts/ci-router.py --files "$files_json" > "$RUNNER_TEMP/ci-router-result.json"; then
            echo "::error::ci-router: failed to route the change list"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/ci-router-result.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          targets = result["targets"]
          launch = result.get("launch_targets", [])
          print("### Selective CI router (F21-02)")
          print(f"- targets ({len(targets)}): {', '.join(targets) if targets else '(none)'}")
          print(f"- launch targets ({len(launch)}): {', '.join(launch) if launch else '(none)'}")
          print(f"- resolver conclusion: {result['resolver_conclusion']} / pending: {result['pending']}")
          PY
          # Publish the same routing as the resolver job outputs; the
          # dependent extension-ci job consumes launch_matrix through
          # fromJSON (B2-SOL-M1).  The router is deterministic, so this
          # second run over the same change list yields the same
          # result as the JSON run above.
          python3 scripts/ci-router.py --files "$files_json" --format github >> "$GITHUB_OUTPUT"

      - name: Validate Test Contract v2 schema and semantics
        run: python tests/test-test-contract.py

      - name: Test Windows ZIP parity comparison
