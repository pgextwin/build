name: Validate build infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# F21-02 concurrency contract (DESIGN 2.2 / PLAN-F 5.4 / CB-73): the
# router workflow is its own processing type.  The group is scoped per
# pull request (or per ref for push / dispatch) so unrelated changes
# never share a group, and cancel-in-progress stays false like every
# other processing-type group in this repository.
concurrency:
  group: ci-router-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  resolver:
    runs-on: ubuntu-latest
    # F21-02: the selective CI router's result is a launch contract,
    # not a display.  The route step publishes it as these job outputs
    # and the dependent extension-ci job consumes the launch matrix
    # through fromJSON (B2-SOL-M1).
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
      has_targets: ${{ steps.route.outputs.has_targets }}
      targets: ${{ steps.route.outputs.targets }}
      launch_matrix: ${{ steps.route.outputs.launch_matrix }}
      has_launch_targets: ${{ steps.route.outputs.has_launch_targets }}
      resolver_conclusion: ${{ steps.route.outputs.resolver_conclusion }}
      pending: ${{ steps.route.outputs.pending }}
    steps:
      - name: Check out build infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify local authorization ticket foundation (OFFLINE NO AUTHORITY)
        run: python tests/test-verify-local-authorized-candidate.py

      - name: Verify local authorization live issuer bindings (OFFLINE NO AUTHORITY)
        run: python tests/test-local-auth-live.py

      - name: Install exact dependency for source-pinned R11 workflow YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Reject unsigned, skipped and stale remote candidate Runs (NO RELEASE)
        run: python tests/test-publisher-candidate-intake.py

      - name: Resolve exact promotion Run IDs and bind the owner comment (NO RELEASE)
        run: python tests/test-promotion-run-resolver.py

      - name: Verify reusable single-repository token revocation and isolation (NO RELEASE)
        run: python tests/test-publisher-scoped-token.py

      - name: Test nonpublishing Publisher App proof without credentials
        run: python tests/test-probe-publisher-app.py

      - name: Deny spoofed external App owner, key, repository scope and token replay (NO CREDENTIALS)
        run: python tests/test-probe-external-direct-provider-app.py

      - name: Reject forged external Publisher source, overbroad App and Release write (NO CREDENTIALS)
        run: python tests/test-external-direct-source-pr-admission.py
      - name: Require original-owner, protected-main and no-mirror signed GET-only issuer (OFFLINE)
        run: python tests/test-external-direct-get-issuer.py

      - name: Fault-inject private original provider 502/503/504, connection loss, and byte-deny (OFFLINE)
        run: python tests/test-external-direct-get-originals.py

      - name: Reject wrong portalcorp PG16 original ZIP binding and GET escalation (OFFLINE)
        run: python tests/test-external-direct-get-portalcorp-cohort.py


      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"




























      - name: Validate GitHub Actions trust policy
        run: python tests/test-github-actions-security.py

      - name: Test required Windows summary
        run: python tests/test-required-windows-summary.py

      - name: Test main Windows CI reuse
        run: python tests/test-windows-main-reuse.py

