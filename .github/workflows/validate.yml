name: Validate build infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Validate GitHub Actions trust policy
        run: python tests/test-github-actions-security.py

      - name: Validate PG14-18 minimal EDB install arguments and fail-closed retry
        run: python tests/test-postgresql-minimal-install.py

      - name: Validate five-major Chocolatey selected-components real-test-only path
        run: python tests/test-postgresql-component-only.py

      - name: Validate PG14-18 read-only EDB phase timing fixtures
        run: python tests/test-edb-install-timing.py

      - name: Validate update watch fixtures
        run: python tests/test-update-watch.py

      - name: Validate Step 19 candidate update fixtures
        run: python tests/test-candidate-update.py

      - name: Deny forged Wave3 failed-candidate recovery and preserve original attempts
        run: python tests/test-first-release-recovery.py

      - name: Verify first-release intent and deny forged candidate/promotion
        run: python tests/test-first-release-candidate.py

      - name: Validate Step 21 verified promotion denial fixtures
        run: python tests/test-promotion-gate.py

      - name: Validate Step 21 create-only formal publisher denial fixtures
        run: python tests/test-publish-release.py

      - name: Validate heterogeneous 14-extension manual Release identities
        run: python tests/test-fleet-release-identity.py

      - name: Validate 14-extension manual promotion candidate authorization
        run: python tests/test-fleet-promotion-gate.py

      - name: Validate shared four-extension manual signed promotion contract
        run: python tests/test-shared-manual-promotion.py

      - name: Validate inert Chat PR authorization and hostile merge/event fixtures
        run: python tests/test-chat-pr-authorization.py

      - name: Ensure retired one-shot proof workflows remain archived from Actions
        run: python tests/test-retired-oneoff-workflows.py

      - name: Validate third-wave GET-only PR/push admission and no-Writer boundary
        run: python tests/test-chat-publication-readonly.py

      - name: Reject forged or stale first-candidate bot CI and preserve publication DENY
        run: python tests/test-first-candidate-readonly.py

      - name: Validate three-target GitHub-hosted Actions runtime double-GET negative acceptance
        run: python tests/test-issue-75-wave3-actions-readonly.py

      - name: Validate typed publication receipts and event isolation
        run: python tests/test-release-authorization.py

      - name: Validate Phase C plpgsql_check read-only pilot evidence and deny fixtures
        run: python tests/test-chat-pr-pilot-evidence.py

      - name: Validate single-repo Classic protection audit deny contract (#75)
        run: python tests/test-classic-protection-audit.py

      - name: Validate Wave3 per-repo Classic read-only protection and no-bypass deny contract
        run: python tests/test-issue-75-wave3-classic-readonly.py

      - name: Validate strict GraphQL effective-ref bypass-zero proof fixtures (#75)
        run: python tests/test-classic-graphql-bypass.py

      - name: Validate strict two-snapshot Classic REST-GraphQL composite contract (#75)
        run: python tests/test-classic-composite-protection.py

      - name: Validate dormant single-target auditor Administration READ token issuer and revocation hostile contract
        run: python tests/test-issue-75-wave3-auditor-read-mint-probe.py

      - name: Validate independent read-only audit App identity and four-repository scope contract
        run: python tests/test-issue-75-wave3-auditor-app-get-preflight.py

      - name: Validate Wave3 reused Classic REST-GraphQL complete anti-bypass contract (offline only)
        run: python tests/test-issue-75-wave3-classic-composite.py

      - name: Validate Phase C shared candidate and PR provenance binding (synthetic only)
        run: python tests/test-chat-pr-phase-c-join.py

      - name: Validate Phase D prepublication JIT and TOCTOU denial fixtures (#75)
        run: python tests/test-chat-pr-phase-d-prepublish.py

      - name: Validate Phase D atomic create-only tag/replay simulation (offline only)
        run: python tests/test-chat-pr-phase-d-atomic-replay.py

      - name: Validate Phase D real-GitHub reader and signed-byte denial fixtures (#75)
        run: python tests/test-chat-pr-phase-d-github-readonly.py

      - name: Validate Phase D fixed public Release signed-evidence fixtures (#75)
        run: python tests/test-verify-public-signed-release-readonly.py

      - name: Validate Phase D authenticated negative probe and no-write guards (#75)
        run: python tests/test-chat-pr-phase-d-live-deny-probe.py

      - name: Validate G2 independent real-read negative audit offline DENY fixtures (#75)
        run: python tests/test-chat-pr-g2-live-negative.py

      - name: Validate G3 future event, typed receipt, PACKAGE-INFO and inert publisher boundary (#75)
        run: python tests/test-chat-pr-g3-inert-contract.py

      - name: Enforce exact 14 BUILD manual-only Release allowlist and fail-closed controls
        run: python tests/test-fleet-promotion-policy.py

      - name: Validate PRE-G4 run attempt and certificate provenance boundary (offline only)
        run: python tests/test-issue-75-attempt-provenance-readonly.py

      - name: Validate PRE-G4 inert Publisher attempt and pin migration adversarial contract
        run: python tests/test-issue-75-attempt-pin-migration-offline.py

      - name: Validate PRE-G4 independent live certificate auditor adversarial fixtures
        run: python tests/test-issue-75-historical-certificate-readonly.py

      - name: Validate 14-extension ID-scoped attested publisher denial fixtures
        run: python tests/test-fleet-publish-release.py

      - name: Validate PRE-G4 main Publisher active-manual fail-closed guards (offline only)
        run: python tests/test-issue-75-main-publisher-guard.py

      - name: Validate GO B bounded GET-only live observer, double-JIT and no-write DENY fixtures
        run: python tests/test-issue-75-go-b-live-readonly.py

      - name: Validate Issue75 immutable critical-pin closure and recovery v2 hostile evidence (record-only)
        run: |
          python tests/test-issue-75-go-b-critical-pin-closure.py
          python scripts/issue-75-go-b-critical-pin-closure.py --snapshot evidence/issue-75/critical-pin-closure-20261017.json


      - name: Validate Issue75 transitive SHA subgraph, unresolved external dependencies and isolated Reader
        run: |
          python tests/test-issue-75-transitive-dependency-delta.py
          python scripts/issue-75-transitive-dependency-delta.py

      - name: Validate Issue75 trusted-main Reader Signer Writer negative principal boundary
        run: python tests/test-issue-75-principal-boundaries.py

      - name: Validate Issue75 live pinned Publisher, Signer OIDC, Writer token custody hostile fixtures
        run: python tests/test-issue-75-active-principal-custody-readonly.py

      - name: Fail closed on self-asserted real Signer OIDC and independent Writer authorization (#75)
        run: |
          python tests/test-issue-75-real-principal-acceptance.py
          python scripts/issue-75-real-principal-acceptance.py --mode static

      - name: Validate Issue75 dormant private Signer crypto and Writer App issuance/revocation hostile contract
        run: python tests/test-issue-75-private-principal-runtime.py

      - name: Validate Issue75 create-only local prewrite seal and fsync quarantine (NOT Publisher)
        run: python tests/test-issue-75-durable-prewrite-seal.py

      - name: Validate Issue75 Signer checkout-hardening candidate and pinned Action root inventory
        run: |
          python tests/test-issue-75-signer-hardening.py
          python scripts/issue-75-signer-checkout-hardening.py

      - name: Validate bounded public Action bundle, PyPI wheel and Chocolatey archive plan (#75)
        run: |
          python tests/test-issue-75-external-byte-probe.py

      - name: Validate Issue75 inert Chocolatey script analyzer and platform wheel lock
        run: |
          python tests/test-issue-75-edb-wheel-lock.py

      - name: Validate PRE-G4 inert immutable recovery evidence denial fixtures (#75)
        run: python tests/test-release-recovery-evidence.py

      - name: Validate default-denied post-manual Release Catalog policy
        run: python tests/test-manual-release-downstream.py

      - name: Validate Step 22 unattended publication safety contract
        run: |
          python tests/test-unattended-policy.py
          python scripts/unattended-policy.py --policy metadata/unattended-publication.json --fleet metadata/automation-fleet.json

      - name: Validate Step 20 fleet policy fixtures
        run: python tests/test-fleet-control.py

      - name: Validate Step 20 candidate artifact fixtures
        run: python tests/test-verify-candidate.py

      - name: Validate Step 20 aggregated fleet status fixtures
        run: python tests/test-fleet-status.py

      - name: Validate daily 17-extension stable upstream audit (GET only)
        run: python tests/test-fleet-upstream-watch.py

      - name: Validate extension manifest schema
        run: python tests/test-extension-schema.py

      - name: Validate Test Contract v2 schema and semantics
        run: python tests/test-test-contract.py

      - name: Validate package metadata schema
        run: python tests/test-package-metadata-schema.py

      - name: Validate SBOM contract
        run: python tests/test-sbom-validation.py

      - name: Validate vulnerability report contract
        run: python tests/test-vulnerability-report.py

      - name: Test package metadata finalizer
        shell: pwsh
        run: ./tests/test-package-metadata-finalizer.ps1

      - name: Validate PostgreSQL lifecycle and readiness metadata
        shell: pwsh
        run: |
          ./tests/test-postgresql-metadata.ps1
          ./tests/test-postgresql-metadata.ps1 -PostgreSqlConfigPath ./tests/fixtures/postgresql-pg19-readiness.json

      - name: Test matrix resolver
        shell: pwsh
        run: ./tests/test-resolve-matrix.ps1
