name: Shared operator update authorization and read-only detection

# Exactly the previous 17-workflow read-only/operator preflight, reused through
# immutable SHA callers. Candidate Issue write and candidate PR/Actions write
# remain in each original caller with original cohort-pinned reusable workflow.
on:
  workflow_call:
    inputs:
      dry_run:
        description: Read-only detection (true), or human UPDATE candidate (false)
        required: true
        type: boolean
      confirm_update:
        description: Exact human UPDATE confirmation
        required: false
        default: ''
        type: string
      expected_main_sha:
        description: Exact main SHA for the human requested candidate
        required: false
        default: ''
        type: string
      detector_sha:
        description: Original immutable central detector SHA, cohort checked
        required: true
        type: string
    outputs:
      mode:
        description: read-only or candidate after strict immutable-pin authorization
        value: ${{ jobs.authorize.outputs.mode }}

permissions:
  contents: read

jobs:
  authorize:
    name: Fail-closed dispatch and operator preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Authorize read-only or human candidate request
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_UPDATE: ${{ inputs.confirm_update }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DETECTOR_SHA: ${{ inputs.detector_sha }}
        run: |
          set -euo pipefail
          # Enforce immutable, per-cohort original detector refs. A caller
          # cannot choose a new GitHub workflow/code SHA by using an input.
          case "$REPO" in
            pgextwin/pg_bigm|pgextwin/pg_cron|pgextwin/pg_hint_plan|pgextwin/pgaudit|pgextwin/set_user|pgextwin/pg_repack|pgextwin/pg_ivm|pgextwin/pg_qualstats|pgextwin/plpgsql_check|pgextwin/hypopg|pgextwin/wal2json|pgextwin/pg_partman|pgextwin/pg_stat_monitor|pgextwin/orafce)
              required_sha=16b886b9d06d6f389b369b87ce0c155767697ca0 ;;
            pgextwin/pgtap|pgextwin/pg_variables|pgextwin/pg_store_plans)
              required_sha=acd6eb28be6d750e89b626fa4ccd4403e1265cd6 ;;
            *) echo 'DENY: unregistered update-watch caller' >&2; exit 1 ;;
          esac
          if [[ "$DETECTOR_SHA" != "$required_sha" ]]; then
            echo 'DENY: detector immutable SHA differs from original validated cohort' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$REF_NAME" != "refs/heads/main" || "$RUN_ATTEMPT" != "1" ]]; then
            echo 'DENY: only first-attempt manual dispatch on main' >&2
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ -n "$CONFIRM_UPDATE" || -n "$EXPECTED_MAIN_SHA" ]]; then
              echo 'DENY: dry-run request must not carry a candidate authorization' >&2
              exit 1
            fi
            echo 'mode=read-only' >> "$GITHUB_OUTPUT"
            echo 'READ_ONLY: upstream detection; no candidate or candidate-decision artifact' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DRY_RUN" == "false" ]]; then
            if [[ "$ACTOR" != "ShutenOishi" || "$TRIGGERING_ACTOR" != "ShutenOishi" || "$CONFIRM_UPDATE" != "UPDATE" || ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_MAIN_SHA" != "$HEAD_SHA" ]]; then
              echo 'DENY: candidate requires human operator, UPDATE and exact main SHA' >&2
              exit 1
            fi
            echo 'mode=candidate' >> "$GITHUB_OUTPUT"
            echo 'CANDIDATE_REQUEST: no Release or publication permission' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'DENY: unrecognized dry_run value' >&2
            exit 1
          fi

  watch_readonly:
    name: Read-only upstream check (no candidate artifact)
    needs: authorize
    if: ${{ needs.authorize.outputs.mode == 'read-only' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout extension configuration without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable central detector (not the mutating reusable workflow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: ${{ inputs.detector_sha }}
          path: .pgextwin-build
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check live central fleet watch authorization (read only)
        id: fleet
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .pgextwin-build/scripts/fleet-control.py
          --extension config/extension.json
          --watch config/update-watch.json
          --repository "$GITHUB_REPOSITORY"
          --action watch
      - name: Install schema validator
        if: steps.fleet.outputs.allowed == 'true'
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate update watch metadata
        if: steps.fleet.outputs.allowed == 'true'
        run: >-
          python .pgextwin-build/scripts/validate-update-watch.py
          --extension-config config/extension.json
          --watch-config config/update-watch.json
          --schema .pgextwin-build/schema/update-watch.schema.json
      - name: Detect stable upstream only (never reconcile Issues)
        if: steps.fleet.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .pgextwin-build/scripts/check-upstream-update.py
          --extension-config config/extension.json
          --watch-config config/update-watch.json
          --output "$RUNNER_TEMP/update-result.json"
          --watcher-repository pgextwin/build
          --watcher-sha "${{ inputs.detector_sha }}"
      - name: Publish read-only summary (no Artifact)
        if: steps.fleet.outputs.allowed == 'true'
        run: >-
          python .pgextwin-build/scripts/write-update-watch-summary.py
          --result "$RUNNER_TEMP/update-result.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Report centrally suppressed read-only check
        if: steps.fleet.outputs.allowed != 'true'
        run: echo 'Central fleet watch is disabled; no upstream detection or mutation.' >> "$GITHUB_STEP_SUMMARY"

