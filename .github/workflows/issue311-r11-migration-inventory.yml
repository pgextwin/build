name: Issue 311 R11 protected schedule inventory (GET ONLY)
on:
  pull_request:
    paths:
      - 'scripts/issue311-r11-migration-inventory.py'
      - 'tests/test-issue311-r11-migration-inventory.py'
      - '.github/workflows/issue311-r11-migration-inventory.yml'
      - 'docs/audit/issue311-r11-migration-preflight.md'
      - 'scripts/issue311-r11-transition-controls.py'
      - 'tests/test-issue311-r11-transition-controls.py'
      - 'scripts/issue311-r11-functional-boundaries.py'
      - 'tests/test-issue311-r11-functional-boundaries.py'
  push:
    branches: [main]
    paths:
      - 'scripts/issue311-r11-migration-inventory.py'
      - 'tests/test-issue311-r11-migration-inventory.py'
      - '.github/workflows/issue311-r11-migration-inventory.yml'
      - 'docs/audit/issue311-r11-migration-preflight.md'
      - 'scripts/issue311-r11-transition-controls.py'
      - 'tests/test-issue311-r11-transition-controls.py'
      - 'scripts/issue311-r11-functional-boundaries.py'
      - 'tests/test-issue311-r11-functional-boundaries.py'
permissions:
  contents: read
  actions: read
jobs:
  hostile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python tests/test-issue311-r11-migration-inventory.py
      - run: python tests/test-issue311-r11-transition-controls.py
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - run: python tests/test-issue311-r11-functional-boundaries.py
  original_readonly:
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python tests/test-issue311-r11-migration-inventory.py
      - run: python tests/test-issue311-r11-transition-controls.py
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - run: python tests/test-issue311-r11-functional-boundaries.py
      - name: Authenticated protected GitHub GET 17 extension plus build catalog website, no writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-migration-inventory.py --output issue311-r11-original-inventory.json
      - name: Derive function-level 20-repo crosswalk, shared Writer boundary and no-retirement status
        run: python scripts/issue311-r11-transition-controls.py --inventory issue311-r11-original-inventory.json --output issue311-r11-crosswalk.json
      - name: GET original 28 workflow bytes and record exact scheduled job boundaries (NO ACCEPTANCE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/issue311-r11-functional-boundaries.py
          --original issue311-r11-original-inventory.json
          --crosswalk issue311-r11-crosswalk.json
          --output issue311-r11-functional-boundaries.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r11-authentic-schedule-inventory
          path: |
            issue311-r11-original-inventory.json
            issue311-r11-crosswalk.json
            issue311-r11-functional-boundaries.json
          if-no-files-found: error
          retention-days: 30
  independent_readback:
    needs: original_readonly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Retrieve source Runner original JSON using authenticated Actions GET
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name issue311-r11-authentic-schedule-inventory --dir .
      - name: Separate App-keyless authenticated GET and exact JSON readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-migration-inventory.py --verify --output issue311-r11-original-inventory.json
      - name: Read-only independent crosswalk recomputation and exact bytes
        run: python scripts/issue311-r11-transition-controls.py --inventory issue311-r11-original-inventory.json --output issue311-r11-crosswalk.json --verify
      - name: Independently GET the pinned original YAML and verify exact job-graph evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python tests/test-issue311-r11-functional-boundaries.py
          python scripts/issue311-r11-functional-boundaries.py \
            --original issue311-r11-original-inventory.json \
            --crosswalk issue311-r11-crosswalk.json \
            --output issue311-r11-functional-boundaries.json --verify
