name: Issue 311 R04/R05 generic real App source (NONPUBLISHING)

# New one-shot request only. No cron/dispatch, no publication endpoint.
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261029-r04r05generic03.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-r04r05-generic-origin
  cancel-in-progress: false

jobs:
  source:
    name: Bind genuine source Run to dedicated App state checkpoint
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    environment: issue311-state-writer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Verify protected origin/orafce GET; commit finite generic checkpoint via exact App
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r04r05-generic-live.py source
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r04r05-original-source
          path: issue311-r04r05-original.json
          if-no-files-found: warn
          retention-days: 30
