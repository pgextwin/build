name: Issue 311 R05 unified 17 original ZIP to App CAS completion (NONPUBLISHING)

on:
  workflow_run:
    workflows:
      - Issue 311 R05 unified 17 App persisted original Windows (NONPUBLISHING)
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-unified17-completion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  complete:
    name: Authenticate source and rehash 18 original ZIPs before App terminal
    if: github.repository == 'pgextwin/build' && github.event_name == 'workflow_run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: issue311-state-writer
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Original authenticated Run, Windows 17 ZIPs, durable App-only NO_UPDATE
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r05-unified17-completion.py complete
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-unified17-original-completion
          path: issue311-r05-unified17-completion.json
          if-no-files-found: warn
          retention-days: 30
