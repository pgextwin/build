name: Issue 311 R05 finite independent event-loss watchdog (NONPUBLISHING)

# Triggered ONCE by the same protected request push, not by workflow_run.
# No cron, dispatch, always-on service, Publisher or Catalog authority.
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261029-r04r05generic03.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-r05-independent-finite-watchdog
  cancel-in-progress: false

jobs:
  finite:
    name: Original Run/bridge poll with deadline and App-only fail-closed terminal
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    environment: issue311-state-writer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Independently watch original source and actual bridge until finite deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r05-finite-watchdog.py observe
      - name: Persist missing-event FAILED or uncertain QUARANTINED via dedicated App CAS
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r05-finite-watchdog.py finalize
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-independent-watchdog
          path: issue311-r04r05-watchdog-observation.json
          if-no-files-found: warn
          retention-days: 30
