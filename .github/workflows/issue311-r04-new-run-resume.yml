name: Issue 311 R04 genuine new Run restores stopped original protected checkpoint (NONPUBLISHING)
on:
  push:
    branches: [main]
    paths: ['.github/execution-requests/r-20261029-r04resumed02.json']
permissions:
  contents: read
concurrency:
  group: issue311-r04-crashed-run-independent-resume-once
  cancel-in-progress: false
jobs:
  admit:
    name: Authenticate second independently merged exact main-push request
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python scripts/issue311-r04-stopped-run.py admit-resume
  recover:
    name: Fresh Runner/App token after real original red Run, lease gen2, revoke401
    needs: admit
    if: needs.admit.result == 'success'
    environment: issue311-state-writer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read original protected durable state; never retry successful original stage
        env:
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r04-stopped-run.py resume
  terminal:
    name: Independent recovered state GET and NO_UPDATE, fail closed if recovery skipped
    needs: [admit, recover]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          ADMIT: ${{ needs.admit.result }}
          RECOVER: ${{ needs.recover.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$ADMIT" = success && test "$RECOVER" = success
          python scripts/issue311-r04-stopped-run.py verify
      - run: echo 'PUBLISH_DENY; no release, no cron, no successful stage repeated'
