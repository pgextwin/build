name: Hourly central recovery of approved original native PR artifacts (NONPUBLISHING)

on:
  schedule:
    # Separate from :00 fleet scan, :20 Catalog reconciliation and :30 local candidate watch.
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: original-native-candidate-audit-fleet
  cancel-in-progress: false

jobs:
  original:
    name: Independent approved attempt and original ZIP/SPDX/Grype audit (no Release)
    if: ${{ github.repository == 'pgextwin/build' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout exact protected central schedule SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python for immutable candidate identity and artifact verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Independently GET each pending registered native PR CI and rehash original artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/recover-native-pr-fleet.py \
            --fleet metadata/automation-fleet.json \
            --output-dir "$RUNNER_TEMP/original-native-audits"
      - name: Retain distinct nonpublishing genuine-schedule audit receipt (not a Release)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registered-original-native-pr-audits
          path: ${{ runner.temp }}/original-native-audits/*.json
          if-no-files-found: ignore
          retention-days: 30
