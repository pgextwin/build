name: Issue 311 R05 intentional event-gap bounded watchdog (NONPUBLISHING)

# Independent same protected request push. Does not require source completion
# delivery. Bounded read-only REST + separately approved state-only App CAS.
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261029-r05eventgap002.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-r05-controlled-unbridged-watchdog
  cancel-in-progress: false

jobs:
  finite:
    name: Genuine source REST and zero listener Runs; timed FAILED checkpoint
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    environment: issue311-state-writer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Finite actual source/bridge REST observation without cron
        env:
          ISSUE311_PROOF_CASE: missing-event
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r05-finite-watchdog.py observe
      - name: Commit verified event-absent FAILED or ambiguous QUARANTINED with App CAS
        env:
          ISSUE311_PROOF_CASE: missing-event
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r05-finite-watchdog.py finalize
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r05-controlled-event-gap-original-observation
          path: issue311-r04r05-watchdog-observation.json
          if-no-files-found: warn
          retention-days: 30
