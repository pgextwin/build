name: Issue 75 historical Sigstore certificate audit (read-only)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/issue-75-historical-certificate-readonly.yml

permissions:
  contents: read
  attestations: read

jobs:
  historical_certificate_readonly:
    name: Historical public SLSA/SPDX certificate x10 (no publication)
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout only protected build main at exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install already used schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Validate hostile synthetic certificate fixtures (not acceptance evidence)
        run: python tests/test-issue-75-historical-certificate-readonly.py

      # Complete all ten read-only predicate checks even if an early X509 claim is absent.
      - name: Independently verify real historical X509 signer/run-attempt binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue-75-historical-certificate-readonly.py
