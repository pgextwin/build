name: Check extension upstream updates

on:
  workflow_call:
    inputs:
      extension_config_path:
        description: Path to config/extension.json in the caller repository
        required: false
        type: string
        default: config/extension.json
      update_watch_path:
        description: Path to config/update-watch.json in the caller repository
        required: false
        type: string
        default: config/update-watch.json
      dry_run:
        description: Detect and summarize without creating, updating, or closing Issues
        required: false
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned pgextwin build watcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Validate update watch contract
        run: >-
          python .pgextwin-build/scripts/validate-update-watch.py
          --extension-config "${{ inputs.extension_config_path }}"
          --watch-config "${{ inputs.update_watch_path }}"
          --schema .pgextwin-build/schema/update-watch.schema.json

      - name: Detect stable upstream candidate
        id: detect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .pgextwin-build/scripts/check-upstream-update.py
          --extension-config "${{ inputs.extension_config_path }}"
          --watch-config "${{ inputs.update_watch_path }}"
          --output "$RUNNER_TEMP/update-result.json"
          --watcher-repository "${{ job.workflow_repository }}"
          --watcher-sha "${{ job.workflow_sha }}"

      - name: Reconcile automation-owned Issue
        if: steps.detect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python .pgextwin-build/scripts/reconcile-update-issue.py \
            --result "$RUNNER_TEMP/update-result.json" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/reconcile-result.json" \
            "${args[@]}"

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -f "$RUNNER_TEMP/reconcile-result.json" ]; then
            args+=(--reconcile "$RUNNER_TEMP/reconcile-result.json")
          fi
          python .pgextwin-build/scripts/write-update-watch-summary.py \
            --result "$RUNNER_TEMP/update-result.json" \
            "${args[@]}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Fail on indeterminate upstream state
        if: steps.detect.outcome != 'success'
        run: |
          echo "Upstream detection was indeterminate. Refusing to report up-to-date or mutate Issues." >&2
          exit 1
