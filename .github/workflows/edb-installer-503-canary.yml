name: SHA256-pinned EDB emergency Windows installer canary

on:
  pull_request:
    paths:
      - "scripts/install-postgresql.ps1"
      - ".github/workflows/edb-installer-503-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: PG${{ matrix.major }} pinned EDB fallback canary
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        major: [14, 15, 16, 17, 18]
    steps:
      - name: Checkout immutable PR content without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use approved Chocolatey or byte-pinned EDB fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $major = [int]"${{ matrix.major }}"
          $pg = (Get-Content 'metadata/postgresql.json' -Raw | ConvertFrom-Json).postgresql |
            Where-Object { $_.major -eq $major } | Select-Object -First 1
          if ($null -eq $pg) { throw 'No approved major' }
          & .\scripts\install-postgresql.ps1 -Major $major -ChocolateyPackage $pg.chocolateyPackage -ChocolateyVersion $pg.chocolateyVersion -TestPort $pg.testPort
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL install failed' }
      - name: Execute real local PostgreSQL bootstrap and SQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:PGROOT 'bin'
          $temp = Join-Path $env:RUNNER_TEMP "pgextwin-edb-test-${{ matrix.major }}"
          $data = Join-Path $temp 'data'
          New-Item -Path $temp -ItemType Directory -Force | Out-Null
          & (Join-Path $bin 'initdb.exe') -D $data -U postgres -A trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & (Join-Path $bin 'pg_ctl.exe') -D $data -l (Join-Path $temp 'server.log') -o '-p 55432 -c listen_addresses=127.0.0.1' start
          if ($LASTEXITCODE -ne 0) { throw 'pg_ctl start failed' }
          try {
            $result = & (Join-Path $bin 'psql.exe') -X -w -A -t -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 21*2'
            if ($LASTEXITCODE -ne 0 -or $result.Trim() -ne '42') { throw "SQL test failed: $result" }
            Write-Host "PASS: Windows PostgreSQL ${{ matrix.major }} real server and SQL, SHA-pinned fallback eligible"
          } finally {
            & (Join-Path $bin 'pg_ctl.exe') -D $data -m immediate stop | Out-Null
          }
