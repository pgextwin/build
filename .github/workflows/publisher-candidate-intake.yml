name: Hourly independent Publisher candidate intake (READ ONLY)
on:
  schedule:
    # Offset from central :00 scanner and local :30 candidate workflows.
    - cron: '15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-candidate-intake.yml'
      - 'scripts/publisher-candidate-intake.py'
      - 'scripts/verify-completed-signed-source.py'
      - 'scripts/automatic-publisher-admission.py'
      - 'scripts/select-signed-publisher-candidates.py'
      - 'scripts/publisher-scoped-token.py'
      - 'metadata/automation-fleet.json'

permissions:
  contents: read

concurrency:
  group: central-publisher-intake
  cancel-in-progress: false

jobs:
  nonpublishing_intake:
    name: Inspect 17/future candidate signed runs; deny unverified Release
    if: github.repository == 'pgextwin/build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_candidates: ${{ steps.select.outputs.has_candidates }}
      candidate_matrix: ${{ steps.select.outputs.candidate_matrix }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Authenticated cross-repository GET of protected main, original signed jobs and audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publisher-candidate-intake.py \
            --fleet metadata/automation-fleet.json \
            --output "$RUNNER_TEMP/publisher-candidate-intake.json" \
            --summary "$RUNNER_TEMP/publisher-candidate-intake.md"
      - name: Select exact original signed runs for separate real-byte verification
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select-signed-publisher-candidates.py \
            --intake "$RUNNER_TEMP/publisher-candidate-intake.json" \
            --fleet metadata/automation-fleet.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish explicit nonpublishing observations
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/publisher-candidate-intake.md" ]; then
            cat "$RUNNER_TEMP/publisher-candidate-intake.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'INTAKE=INDETERMINATE; PUBLISH_DENY; no signed Release authorization' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve machine-readable candidate-only intake (NO RELEASE)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-candidate-intake-nonpublishing
          path: |
            ${{ runner.temp }}/publisher-candidate-intake.json
            ${{ runner.temp }}/publisher-candidate-intake.md
          if-no-files-found: error
          retention-days: 30

  independent_real_signed_source:
    name: Fresh independent ZIP/SPDX/Grype/Sigstore GET for signed original
    needs: nonpublishing_intake
    if: >-
      ${{ needs.nonpublishing_intake.outputs.has_candidates == 'true' &&
          github.repository == 'pgextwin/build' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.nonpublishing_intake.outputs.candidate_matrix) }}
    steps:
      - name: Checkout current protected central verifier (no persistent credential)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout EXACT signed packaging main SHA (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: .pgextwin-candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Redownload original and second-opinion audit + real signed PG assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_EXTENSION: ${{ matrix.name }}
          ORIGINAL_RUN_ID: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/second" "$RUNNER_TEMP/signed-raw" "$RUNNER_TEMP/signed-dist"
          gh run download "$ORIGINAL_RUN_ID" --repo "$TARGET_REPOSITORY" --name automatic-signed-candidate-audit-nonpublishing --dir "$RUNNER_TEMP/original"
          gh run download "$ORIGINAL_RUN_ID" --repo "$TARGET_REPOSITORY" --name independent-signed-publisher-preflight-nonpublishing --dir "$RUNNER_TEMP/second"
          gh run download "$ORIGINAL_RUN_ID" --repo "$TARGET_REPOSITORY" --pattern "${TARGET_EXTENSION}-pg*-windows-x64" --dir "$RUNNER_TEMP/signed-raw"
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          root = Path(os.environ["RUNNER_TEMP"])
          incoming, final = root / "signed-raw", root / "signed-dist"
          files = [p for p in incoming.rglob("*") if p.is_file()]
          assert files and all(not p.is_symlink() for p in incoming.rglob("*"))
          assert len({p.name for p in files}) == len(files), "duplicate artifact filename"
          for item in files:
              assert item.suffix in (".zip", ".json") and not item.name.startswith(".")
              shutil.copyfile(item, final/item.name)
          print("ORIGINAL_ASSETS_REDOWNLOADED="+str(len(files))+"; NO_PUBLISH")
          PY
      - name: Fresh real Sigstore, immutable source ZIP/SPDX/Grype and exact current-main recheck
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          SOURCE_SHA: ${{ matrix.sha }}
          ORIGINAL_RUN_ID: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-completed-signed-source.py \
            --repository "$TARGET_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --run-id "$ORIGINAL_RUN_ID" \
            --dist "$RUNNER_TEMP/signed-dist" \
            --manifest .pgextwin-candidate/config/extension.json \
            --lifecycle metadata/postgresql.json \
            --fleet metadata/automation-fleet.json \
            --original "$RUNNER_TEMP/original/automatic-signed-candidate-audit.json" \
            --second "$RUNNER_TEMP/second/independent-signed-candidate-audit.json" \
            --output "$RUNNER_TEMP/independent-completed-source-nonpublishing.json"
          echo "Real Sigstore and signed source independently rechecked; still PUBLISH_DENY." >> "$GITHUB_STEP_SUMMARY"
      - name: Correlate actual central schedule with newly reverified signed source (DENY)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SOURCE_SHA: ${{ matrix.sha }}
          TARGET_SOURCE_RUN: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/pgextwin/build/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/schedule-run.json"
          gh api --method GET repos/pgextwin/build/branches/main > "$RUNNER_TEMP/central-main.json"
          python scripts/automatic-publisher-admission.py \
            --source "$RUNNER_TEMP/independent-completed-source-nonpublishing.json" \
            --proposal "$RUNNER_TEMP/original/automatic-release-tag-proposal-nonpublishing.json" \
            --manifest .pgextwin-candidate/config/extension.json \
            --fleet metadata/automation-fleet.json \
            --central-policy metadata/release-promotion.json \
            --local-policy .pgextwin-candidate/config/release-promotion.json \
            --unattended metadata/unattended-publication.json \
            --publisher-boundary metadata/publisher-write-boundary.json \
            --schedule-run "$RUNNER_TEMP/schedule-run.json" \
            --central-branch "$RUNNER_TEMP/central-main.json" \
            --output "$RUNNER_TEMP/scheduled-publisher-admission-nonpublishing.json"
          echo 'Original Sigstore and central schedule correlated; Publisher policy DENY remains.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence only (NO Publisher Environment or token)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-completed-source-nonpublishing-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/independent-completed-source-nonpublishing.json
            ${{ runner.temp }}/scheduled-publisher-admission-nonpublishing.json
          if-no-files-found: warn
          retention-days: 30
