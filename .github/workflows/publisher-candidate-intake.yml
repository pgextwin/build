name: Hourly independent Publisher candidate intake (default DENY)
on:
  schedule:
    # Offset from central :00 scanner and local :30 candidate workflows.
    - cron: '15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-candidate-intake.yml'
      - 'scripts/publisher-candidate-intake.py'
      - 'scripts/verify-completed-signed-source.py'
      - 'scripts/automatic-publisher-admission.py'
      - 'scripts/automatic-publisher-receipt-issuer.py'
      - 'scripts/unattended-policy.py'
      - 'scripts/fleet-policy.py'
      - 'scripts/automatic-publisher-readiness.py'
      - 'scripts/automatic-publisher-run.py'
      - 'scripts/download-original-signed-source.py'
      - 'scripts/fleet-publish-release.py'
      - 'metadata/publisher-write-boundary.json'
      - 'metadata/unattended-publication.json'
      - 'metadata/release-promotion.json'
      - 'scripts/select-signed-publisher-candidates.py'
      - 'scripts/select-verified-publisher-candidates.py'
      - 'scripts/publisher-scoped-token.py'
      - 'metadata/automation-fleet.json'

permissions:
  contents: read

concurrency:
  group: central-publisher-intake
  cancel-in-progress: false

jobs:
  nonpublishing_intake:
    name: Inspect 17/future candidate signed runs; deny unverified Release
    if: github.repository == 'pgextwin/build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_candidates: ${{ steps.select.outputs.has_candidates }}
      candidate_matrix: ${{ steps.select.outputs.candidate_matrix }}
      publisher_ready: ${{ steps.readiness.outputs.publisher_ready }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Read-only protected central automatic Publisher opt-in gate
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/automatic-publisher-readiness.py \
            --fleet metadata/automation-fleet.json \
            --central-policy metadata/release-promotion.json \
            --unattended metadata/unattended-publication.json \
            --publisher-boundary metadata/publisher-write-boundary.json \
            --github-output "$GITHUB_OUTPUT"
          echo "Publisher readiness is only a protected static policy check; real issuer and App gates remain mandatory." >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticated cross-repository GET of protected main, original signed jobs and audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publisher-candidate-intake.py \
            --fleet metadata/automation-fleet.json \
            --output "$RUNNER_TEMP/publisher-candidate-intake.json" \
            --summary "$RUNNER_TEMP/publisher-candidate-intake.md"
      - name: Select exact original signed runs for separate real-byte verification
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select-signed-publisher-candidates.py \
            --intake "$RUNNER_TEMP/publisher-candidate-intake.json" \
            --fleet metadata/automation-fleet.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish explicit nonpublishing observations
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/publisher-candidate-intake.md" ]; then
            cat "$RUNNER_TEMP/publisher-candidate-intake.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'INTAKE=INDETERMINATE; PUBLISH_DENY; no signed Release authorization' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve machine-readable candidate-only intake (NO RELEASE)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-candidate-intake-nonpublishing
          path: |
            ${{ runner.temp }}/publisher-candidate-intake.json
            ${{ runner.temp }}/publisher-candidate-intake.md
          if-no-files-found: error
          retention-days: 30

  independent_real_signed_source:
    name: Fresh independent ZIP/SPDX/Grype/Sigstore GET for signed original (${{ matrix.name }})
    needs: nonpublishing_intake
    if: >-
      ${{ needs.nonpublishing_intake.outputs.has_candidates == 'true' &&
          github.repository == 'pgextwin/build' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.nonpublishing_intake.outputs.candidate_matrix) }}
    steps:
      - name: Checkout current protected central verifier (no persistent credential)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout EXACT signed packaging main SHA (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: .pgextwin-candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Re-download ORIGINAL signed PG ZIP/SPDX/Grype and two audits (READ ONLY)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          ORIGINAL_RUN_ID: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download-original-signed-source.py \
            --repository "$TARGET_REPOSITORY" --run-id "$ORIGINAL_RUN_ID" \
            --directory "$RUNNER_TEMP/pgextwin-original"
      - name: Fresh real Sigstore, immutable source ZIP/SPDX/Grype and exact current-main recheck
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          SOURCE_SHA: ${{ matrix.sha }}
          ORIGINAL_RUN_ID: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-completed-signed-source.py \
            --repository "$TARGET_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --run-id "$ORIGINAL_RUN_ID" \
            --dist "$RUNNER_TEMP/pgextwin-original/signed-dist" \
            --manifest .pgextwin-candidate/config/extension.json \
            --lifecycle metadata/postgresql.json \
            --fleet metadata/automation-fleet.json \
            --original "$RUNNER_TEMP/pgextwin-original/original/automatic-signed-candidate-audit.json" \
            --second "$RUNNER_TEMP/pgextwin-original/second/independent-signed-candidate-audit.json" \
            --output "$RUNNER_TEMP/independent-completed-source-nonpublishing.json"
          echo "Real Sigstore and signed source independently rechecked; still PUBLISH_DENY." >> "$GITHUB_STEP_SUMMARY"
      - name: Correlate genuine schedule with still-manual publication policy (DENY)
        if: ${{ github.event_name == 'schedule' && needs.nonpublishing_intake.outputs.publisher_ready != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SOURCE_SHA: ${{ matrix.sha }}
          TARGET_SOURCE_RUN: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/pgextwin/build/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/schedule-run.json"
          gh api --method GET repos/pgextwin/build/branches/main > "$RUNNER_TEMP/central-main.json"
          python scripts/automatic-publisher-admission.py \
            --source "$RUNNER_TEMP/independent-completed-source-nonpublishing.json" \
            --proposal "$RUNNER_TEMP/pgextwin-original/original/automatic-release-tag-proposal-nonpublishing.json" \
            --manifest .pgextwin-candidate/config/extension.json \
            --fleet metadata/automation-fleet.json \
            --central-policy metadata/release-promotion.json \
            --local-policy .pgextwin-candidate/config/release-promotion.json \
            --unattended metadata/unattended-publication.json \
            --publisher-boundary metadata/publisher-write-boundary.json \
            --schedule-run "$RUNNER_TEMP/schedule-run.json" \
            --central-branch "$RUNNER_TEMP/central-main.json" \
            --output "$RUNNER_TEMP/scheduled-publisher-admission-nonpublishing.json"
          echo 'Original Sigstore and central schedule correlated; Publisher policy DENY remains.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence only (NO Publisher Environment or token)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-completed-source-nonpublishing-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/independent-completed-source-nonpublishing.json
            ${{ runner.temp }}/scheduled-publisher-admission-nonpublishing.json
          if-no-files-found: warn
          retention-days: 30

  select_verified_sources:
    # A failed peer must not prevent a repository whose separate proof passed.
    # This read-only job independently GETs the actual same-run jobs; failed,
    # skipped, missing or mismatched proofs never enter Publisher Environment.
    name: Select independently verified repositories for isolated Publisher
    needs: [nonpublishing_intake, independent_real_signed_source]
    if: >-
      ${{ always() && !cancelled() &&
          github.event_name == 'schedule' &&
          github.repository == 'pgextwin/build' &&
          github.ref == 'refs/heads/main' &&
          needs.nonpublishing_intake.result == 'success' &&
          needs.nonpublishing_intake.outputs.has_candidates == 'true' &&
          needs.nonpublishing_intake.outputs.publisher_ready == 'true' &&
          (needs.independent_real_signed_source.result == 'success' ||
           needs.independent_real_signed_source.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publisher_matrix: ${{ steps.select.outputs.publisher_matrix }}
      has_verified_sources: ${{ steps.select.outputs.has_verified_sources }}
    steps:
      - name: Checkout exact protected read-only proof selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require authentic successful same-run proof for each selected repository
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MATRIX: ${{ needs.nonpublishing_intake.outputs.candidate_matrix }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select-verified-publisher-candidates.py \
            --candidates-json "$CANDIDATE_MATRIX" \
            --fleet metadata/automation-fleet.json \
            --github-output "$GITHUB_OUTPUT"

  isolated_formal_publisher:
    # Only an authentically signed candidate, genuine schedule and an explicit
    # protected-fleet auto policy may even enter the credentialed Environment.
    # Current manual-only/OBSERVE/PUBLISH_DENY yields publisher_ready=false.
    name: Isolated Publisher App signed formal Release (create only) (${{ matrix.name }})
    needs: [nonpublishing_intake, select_verified_sources]
    if: >-
      ${{ always() && !cancelled() &&
          github.event_name == 'schedule' &&
          github.repository == 'pgextwin/build' &&
          github.ref == 'refs/heads/main' &&
          needs.nonpublishing_intake.result == 'success' &&
          needs.nonpublishing_intake.outputs.publisher_ready == 'true' &&
          needs.select_verified_sources.result == 'success' &&
          needs.select_verified_sources.outputs.has_verified_sources == 'true' }}
    environment: publisher
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.select_verified_sources.outputs.publisher_matrix) }}
    steps:
      - name: Checkout exact protected central Publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact signed packaging protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: .pgextwin-candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Independently download ORIGINAL signed Run bytes (not prior-job authority)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          ORIGINAL_RUN_ID: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download-original-signed-source.py \
            --repository "$TARGET_REPOSITORY" --run-id "$ORIGINAL_RUN_ID" \
            --directory "$RUNNER_TEMP/pgextwin-publisher-original"
      - name: Authenticate signed ZIPs, scheduled Run, live policy, App and create-only formal Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_APP_ID: ${{ vars.PGEXTWIN_PUBLISHER_APP_ID }}
          PUBLISHER_INSTALLATION_ID: ${{ vars.PGEXTWIN_PUBLISHER_INSTALLATION_ID }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PGEXTWIN_PUBLISHER_APP_PRIVATE_KEY }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SOURCE_SHA: ${{ matrix.sha }}
          ORIGINAL_RUN_ID: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/automatic-publisher-run.py \
            --repository "$TARGET_REPOSITORY" --sha "$TARGET_SOURCE_SHA" \
            --source-run "$ORIGINAL_RUN_ID" \
            --dist "$RUNNER_TEMP/pgextwin-publisher-original/signed-dist" \
            --manifest .pgextwin-candidate/config/extension.json \
            --lifecycle metadata/postgresql.json \
            --original "$RUNNER_TEMP/pgextwin-publisher-original/original/automatic-signed-candidate-audit.json" \
            --second "$RUNNER_TEMP/pgextwin-publisher-original/second/independent-signed-candidate-audit.json" \
            --proposal "$RUNNER_TEMP/pgextwin-publisher-original/original/automatic-release-tag-proposal-nonpublishing.json" \
            --fleet metadata/automation-fleet.json \
            --central-policy metadata/release-promotion.json \
            --local-policy .pgextwin-candidate/config/release-promotion.json \
            --unattended metadata/unattended-publication.json \
            --publisher-boundary metadata/publisher-write-boundary.json \
            --recovery "$RUNNER_TEMP/publisher-recovery.json" \
            --output "$RUNNER_TEMP/verified-automatic-release.json"
      - name: Preserve no-secret exact release identity and recovery state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-automatic-formal-release-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/verified-automatic-release.json
            ${{ runner.temp }}/publisher-recovery.json
          if-no-files-found: warn
          retention-days: 30
