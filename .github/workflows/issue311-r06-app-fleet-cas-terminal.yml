name: Issue 311 R06 real 17-App original durable CAS terminal (NONPUBLISHING)
# Separate from the source App identity; only GitHub's authentic completion event
# may start this App CAS workflow. No Chat-created terminal request required.
on:
  workflow_run:
    workflows:
      - Issue 311 17 authentic App-bot local PREPARE originals (NO RELEASE)
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261030-r06appcas17terminal001.json'
  pull_request:
    paths:
      - '.github/workflows/issue311-r06-app-fleet-cas-terminal.yml'
      - 'scripts/issue311-r06-app-fleet-cas-terminal.py'
      - 'tests/test-issue311-r06-app-fleet-cas-terminal.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: issue311-r06-real-app17-cas-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline_negative:
    if: github.event_name == 'pull_request'
    name: R06-06-03 original 17 source-kind, stale/replay, CAS guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - run: python tests/test-issue311-r06-app-fleet-cas-terminal.py
  persist:
    if: >-
      github.repository == 'pgextwin/build' && github.run_attempt == 1 &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi') ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.run_attempt == 1))
    name: Verify 17 genuine original child ZIPs then finite build-only App CAS
    runs-on: ubuntu-latest
    environment: issue311-state-writer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Authenticated original 17 App children ZIP SHA256 then finite CAS PUT/GET (NO RELEASE)
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r06-app-fleet-cas-terminal.py persist
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-app-original-cas-proof
          path: issue311-r06-app-original-cas-proof.json
          if-no-files-found: warn
          retention-days: 30
  independent_readback:
    if: needs.persist.result == 'success'
    needs: persist
    name: Separate read-only Git original CAS state, source-kind and replay DENY
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Independent App-key-free real Git blob readback and durable replay denial
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r06-app-fleet-cas-terminal.py readback
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-app-original-cas-independent-readback
          path: issue311-r06-app-original-cas-readback.json
          if-no-files-found: warn
          retention-days: 30
