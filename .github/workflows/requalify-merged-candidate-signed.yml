name: Independent genuine-schedule merged-candidate OIDC build and two Sigstore audits (NO RELEASE)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  signing_intent:
    name: Authenticate original local schedule and merged native origin (NO PUBLISH)
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      verified: ${{ steps.prove.outputs.verified }}
    steps:
      - name: Checkout exact protected local manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Checkout SHA-pinned shared provenance gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Independently GET central genuine schedule + original bot PR/native CI
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/verify-merged-schedule-signing-intent.py \
            --output "$RUNNER_TEMP/merged-schedule-signing-intent.json" \
            --github-output "$GITHUB_OUTPUT"
          echo 'Genuine original schedule/PR/CI only; fresh OIDC+dual Sigstore still required; PUBLISH_DENY.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve authenticated signing intent only (NO RELEASE)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-scheduled-signing-intent-nonpublishing
          path: ${{ runner.temp }}/merged-schedule-signing-intent.json
          if-no-files-found: error
          retention-days: 30

  signed_windows:
    name: New genuine-schedule OIDC signed Windows PG build (NO PUBLISH)
    needs: signing_intent
    if: ${{ needs.signing_intent.outputs.verified == 'true' && github.event_name == 'schedule' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@5756b3c5136a8bf4db710016cfe97555f0a71c6d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  signed_audit_first:
    name: First independent original Windows ZIP/SPDX/Grype Sigstore verification (NO PUBLISH)
    needs: [signing_intent, signed_windows]
    if: ${{ github.event_name == 'schedule' && needs.signing_intent.outputs.verified == 'true' && needs.signed_windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout exact local protected packaging manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Checkout exact shared independent verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Download original signing intent from THIS same local schedule run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merged-scheduled-signing-intent-nonpublishing
          path: ${{ runner.temp }}/merged-intent-first
      - name: Download original OIDC Windows signed PG14-18 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ github.event.repository.name }}-pg*-windows-x64
          path: ${{ runner.temp }}/signed-dist-first
          merge-multiple: true
      - name: Real cryptographic Sigstore verification on FIRST original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/audit-merged-scheduled-signed-candidate.py \
            --dist "$RUNNER_TEMP/signed-dist-first" \
            --manifest config/extension.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --intent "$RUNNER_TEMP/merged-intent-first/merged-schedule-signing-intent.json" \
            --output "$RUNNER_TEMP/merged-signed-first.json"
      - name: Preserve FIRST independent original Sigstore receipt (NONPUBLISHING)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-signed-first-nonpublishing
          path: ${{ runner.temp }}/merged-signed-first.json
          if-no-files-found: error
          retention-days: 30

  signed_audit_second:
    name: SECOND independent re-download and Sigstore original-byte verification (NO PUBLISH)
    needs: [signing_intent, signed_windows, signed_audit_first]
    if: ${{ github.event_name == 'schedule' && needs.signing_intent.outputs.verified == 'true' && needs.signed_windows.result == 'success' && needs.signed_audit_first.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merged-scheduled-signing-intent-nonpublishing
          path: ${{ runner.temp }}/merged-intent-second
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ github.event.repository.name }}-pg*-windows-x64
          path: ${{ runner.temp }}/signed-dist-second
          merge-multiple: true
      - name: SECOND independent real cryptographic Sigstore verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/audit-merged-scheduled-signed-candidate.py \
            --dist "$RUNNER_TEMP/signed-dist-second" \
            --manifest config/extension.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --intent "$RUNNER_TEMP/merged-intent-second/merged-schedule-signing-intent.json" \
            --output "$RUNNER_TEMP/merged-signed-second.json"
      - name: Preserve SECOND independent original Sigstore receipt (NONPUBLISHING)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-signed-second-nonpublishing
          path: ${{ runner.temp }}/merged-signed-second.json
          if-no-files-found: error
          retention-days: 30

  dual_audit_join:
    name: Require TWO independent source/PG/signature/byte receipts (DENY-only)
    needs: [signing_intent, signed_audit_first, signed_audit_second]
    if: ${{ github.event_name == 'schedule' && needs.signing_intent.outputs.verified == 'true' && needs.signed_audit_first.result == 'success' && needs.signed_audit_second.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pgextwin-build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merged-signed-first-nonpublishing
          path: ${{ runner.temp }}/merged-signed-first
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merged-signed-second-nonpublishing
          path: ${{ runner.temp }}/merged-signed-second
      - name: Independent strict source-kind/bytes/Grype/authentication agreement
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/join-merged-scheduled-oidc-audits.py \
            --first "$RUNNER_TEMP/merged-signed-first/merged-signed-first.json" \
            --second "$RUNNER_TEMP/merged-signed-second/merged-signed-second.json" \
            --manifest config/extension.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --output "$RUNNER_TEMP/merged-scheduled-oidc-dual-audit.json"
          echo 'TWO actual independent Sigstore audits; Publisher source-kind NOT admitted; PUBLISH_DENY.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-scheduled-oidc-dual-audit-nonpublishing
          path: ${{ runner.temp }}/merged-scheduled-oidc-dual-audit.json
          if-no-files-found: error
          retention-days: 30
