name: Hourly stable upstream updates for all 17 extensions

on:
  schedule:
    # Every hour at :00 JST/UTC; GitHub Actions may dispatch late.
    - cron: "0 * * * *"
    # Secondary off-peak genuine schedule to mitigate dropped top-of-hour
    # GitHub Actions events. Same read-only scanner, no authority widening.
    - cron: "7 * * * *"
  # A protected-main code/policy change gets one immediate READ-ONLY live
  # smoke. It is NOT a genuine schedule event and cannot authorize a candidate:
  # verify-scheduled-fleet-candidate.py requires event=schedule.
  push:
    branches: [main]
    paths:
      - ".github/workflows/fleet-upstream-watch.yml"
      - "scripts/fleet-upstream-watch.py"
      - "scripts/update_watch_lib.py"
      - "scripts/fleet-control.py"
      - "scripts/fleet-policy.py"
      - "metadata/automation-fleet.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stable-fleet-watch
  cancel-in-progress: false

jobs:
  readonly-fleet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out protected fleet policy and code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Read-only check of all 17 stable upstreams
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/fleet-upstream-watch.py
          --policy metadata/automation-fleet.json
          --output "$RUNNER_TEMP/fleet-upstream-watch.json"
          --summary "$RUNNER_TEMP/fleet-upstream-watch.md"
      - name: Summarize stable update coverage
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fleet-upstream-watch.md" ]; then
            cat "$RUNNER_TEMP/fleet-upstream-watch.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'INDETERMINATE: fleet scan produced no summary; PUBLISH=DENY.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload auditable read-only snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-upstream-watch
          path: |
            ${{ runner.temp }}/fleet-upstream-watch.json
            ${{ runner.temp }}/fleet-upstream-watch.md
          if-no-files-found: error

  original-native-audit-fallback:
    name: Independent original PR artifacts audit (genuine fleet schedule only; NO PUBLISH)
    # Existing fleet scanner has a proven recurring genuine schedule. Only its
    # schedule event may recover the original approved Windows CI; never a
    # push/dispatch smoke, never automatic Release or authorization.
    if: ${{ github.event_name == 'schedule' && github.repository == 'pgextwin/build' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout exact protected central scheduled SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python for original immutable Windows artifact audit
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Re-GET original approved native PR CI and independently audit ZIP/SPDX/Grype
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/recover-native-pr-fleet.py \
            --fleet metadata/automation-fleet.json \
            --output-dir "$RUNNER_TEMP/original-native-audits"
      - name: Retain original-native audit receipt (NONPUBLISHING)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registered-original-native-pr-audits
          path: ${{ runner.temp }}/original-native-audits/*.json
          if-no-files-found: ignore
          retention-days: 30

  merged-bot-requalification-readonly:
    name: Read-only provenance of four already-merged native candidates (NO SIGN/RELEASE)
    needs: [readonly-fleet]
    # This optional provenance probe must not break an otherwise valid 17/17
    # central scan. A failing probe produces no accepted receipt; its real
    # failing step and logs remain observable, never counted as a PASS.
    continue-on-error: true
    if: ${{ github.event_name == 'schedule' && github.repository == 'pgextwin/build' && github.ref == 'refs/heads/main' && needs.readonly-fleet.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout exact central schedule SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Download ORIGINAL complete same-run fleet snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merged-candidate-scan"
          gh run download "$GITHUB_RUN_ID" \
            --repo pgextwin/build --name fleet-upstream-watch \
            --dir "$RUNNER_TEMP/merged-candidate-scan"
      - name: GET original merged bot PR, current manifest and App15368 native CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-merged-candidate-requalification.py \
            --fleet metadata/automation-fleet.json \
            --registry metadata/merged-candidate-requalification.json \
            --scan "$RUNNER_TEMP/merged-candidate-scan/fleet-upstream-watch.json" \
            --output "$RUNNER_TEMP/merged-native-requalification-nonpublishing.json"
          echo 'Provenance only: signed OIDC build, real ZIP bytes and Publisher still DENY.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve nonpublishing original-provenance receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: merged-native-requalification-provenance-only
          path: ${{ runner.temp }}/merged-native-requalification-nonpublishing.json
          if-no-files-found: ignore
          retention-days: 30
