name: Hourly stable upstream updates for all 26 extensions

on:
  schedule:
    # One off-peak genuine schedule per hour (UTC); delivery is best effort.
    - cron: "7 * * * *"
  # A protected-main code/policy change gets one immediate READ-ONLY live
  # smoke. It is NOT a genuine schedule event and cannot authorize a candidate:
  # verify-scheduled-fleet-candidate.py requires event=schedule.
  push:
    branches: [main]
    paths:
      - ".github/workflows/fleet-upstream-watch.yml"
      - "scripts/fleet-upstream-watch.py"
      - "scripts/update_watch_lib.py"
      - "scripts/fleet-control.py"
      - "scripts/fleet-policy.py"
      - "metadata/automation-fleet.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stable-fleet-watch
  cancel-in-progress: false

jobs:
  readonly-fleet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - name: Check out protected fleet policy and code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read-only check of all 26 stable upstreams
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/fleet-upstream-watch.py
          --policy metadata/automation-fleet.json
          --output "$RUNNER_TEMP/fleet-upstream-watch.json"
          --summary "$RUNNER_TEMP/fleet-upstream-watch.md"
      - name: Summarize stable update coverage
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fleet-upstream-watch.md" ]; then
            cat "$RUNNER_TEMP/fleet-upstream-watch.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'INDETERMINATE: fleet scan produced no summary; PUBLISH=DENY.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload auditable read-only snapshot
        id: snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-upstream-watch
          path: |
            ${{ runner.temp }}/fleet-upstream-watch.json
            ${{ runner.temp }}/fleet-upstream-watch.md
          if-no-files-found: error

  candidate-selection:
    name: Select enabled extensions from the same scheduled scan
    needs: readonly-fleet
    if: >-
      ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
          github.run_attempt == '1' && needs.readonly-fleet.outputs.snapshot != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Legacy callers and requalification still consume the scan run verdict.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_updates: ${{ steps.select.outputs.has_updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.readonly-fleet.outputs.snapshot }}
          path: ${{ runner.temp }}/fleet-snapshot
      - name: Verify scheduled evidence and record pilot decisions
        id: select
        env:
          PGEXTWIN_SCAN_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/fleet-candidate.py select --snapshot "$RUNNER_TEMP/fleet-snapshot/fleet-upstream-watch.json"

  candidate-preparation:
    needs: [readonly-fleet, candidate-selection]
    if: >-
      ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
          github.run_attempt == '1' && needs.candidate-selection.outputs.has_updates == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-selection.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fleet-candidate.yml
    secrets:
      fleet_candidate_app_private_key: ${{ secrets.fleet_candidate_app_private_key }}
    with:
      repository: ${{ matrix.repository }}
      extension: ${{ matrix.extension }}
      sha: ${{ matrix.sha }}
      snapshot: ${{ needs.readonly-fleet.outputs.snapshot }}
