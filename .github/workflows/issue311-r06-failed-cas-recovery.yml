name: Issue 311 R06 failed automatic CAS fail-closed recovery (NONPUBLISHING)
on:
  push:
    branches: [main]
    paths:
      - '.github/execution-requests/r-20261030-r06autofiniterecover01.json'
  pull_request:
    paths:
      - '.github/workflows/issue311-r06-failed-cas-recovery.yml'
      - 'scripts/issue311-r06-failed-cas-recovery.py'
      - 'tests/test-issue311-r06-failed-cas-recovery.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: issue311-r06-failed-cas-recovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline_negative:
    if: github.event_name == 'pull_request'
    name: Historical failed original CAS evidence and nonpublishing recovery negatives
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python tests/test-issue311-r06-failed-cas-recovery.py
  persist:
    if: github.repository == 'pgextwin/build' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi' && github.run_attempt == 1
    name: Authenticate failed original and quarantine exact revision1 via State App CAS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: issue311-state-writer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Verify original source and failed CAS ZIP then persist QUARANTINED, revoke401
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_WRITER_PRIVATE_KEY: ${{ secrets.STATE_WRITER_PRIVATE_KEY }}
        run: python scripts/issue311-r06-failed-cas-recovery.py persist
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-failed-cas-recovery
          path: issue311-r06-failed-cas-recovery.json
          if-no-files-found: warn
          retention-days: 30
  independent_readback:
    if: needs.persist.result == 'success'
    needs: persist
    name: Independent original Git blob readback, terminal replay DENY (NO APP KEY)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Verify original failed run, state Git blob and durable replay rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r06-failed-cas-recovery.py readback
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-r06-failed-cas-recovery-independent-readback
          path: issue311-r06-failed-cas-recovery-readback.json
          if-no-files-found: warn
          retention-days: 30
