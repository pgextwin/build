name: PG14-18 Chocolatey selected-components Windows comparison

on:
  pull_request:
    paths:
      - scripts/install-postgresql-component-only.ps1
      - .github/workflows/chocolatey-components-benchmark.yml
      - tests/test-postgresql-component-only.py
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  selective:
    name: PG${{ matrix.major }} selected Chocolatey server+CLI / real smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/chocolatey-minimal-components-pg14-18-20261019'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {major: 14, package: postgresql14, version: '14.24.0'}
          - {major: 15, package: postgresql15, version: '15.19.0'}
          - {major: 16, package: postgresql16, version: '16.15.5'}
          - {major: 17, package: postgresql17, version: '17.11.4'}
          - {major: 18, package: postgresql18, version: '18.6.5'}
    steps:
      - name: Check out controlled benchmark code without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out independently approved packaging main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/plpgsql_check
          ref: c5b759074db6c8713f8aebed873eb6be8e64513d
          path: pilot
          persist-credentials: false

      - name: Check out upstream immutable source for true Windows compile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: okbob/plpgsql_check
          ref: 0ac96adc13b34d071c4be8ba0ec4f73e6e7520f5
          path: pilot/upstream
          persist-credentials: false

      - name: Verify immutable upstream and packaging source identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git -C pilot rev-parse HEAD).Trim() -cne 'c5b759074db6c8713f8aebed873eb6be8e64513d') { throw 'Wrong packaging SHA' }
          if ((& git -C pilot/upstream rev-parse HEAD).Trim() -cne '0ac96adc13b34d071c4be8ba0ec4f73e6e7520f5') { throw 'Wrong upstream SHA' }
          "| PG | Chocolatey (server+CLI only) install |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | ---: |" >> $env:GITHUB_STEP_SUMMARY

      - name: Chocolatey install only PostgreSQL server and commandline tools
        shell: pwsh
        run: |
          & ./scripts/install-postgresql-component-only.ps1 -Major ([int]'${{ matrix.major }}') -ChocolateyPackage '${{ matrix.package }}' -ChocolateyVersion '${{ matrix.version }}' -TestPort 55432

      - name: Compile pinned plpgsql_check with real MSVC DLL and 48 exports
        shell: pwsh
        run: |
          & ./pilot/windows/ci/build.ps1 -PgRoot $env:PGROOT -UpstreamDir (Join-Path $PWD 'pilot/upstream')

      - name: Install DLL and extension SQL into real PostgreSQL
        shell: pwsh
        run: |
          & ./pilot/windows/ci/install.ps1 -PgRoot $env:PGROOT -UpstreamDir (Join-Path $PWD 'pilot/upstream')

      - name: CREATE EXTENSION and invalid-record-field regression against real PG
        shell: pwsh
        run: |
          & ./pilot/windows/ci/smoke-test.ps1 -PgRoot $env:PGROOT -PgPort 55432 -PostgreSqlMajor ([int]'${{ matrix.major }}')

      - name: Report component-only actual CI success without publication
        shell: pwsh
        run: |
          "PG${{ matrix.major }} CHOCOLATEY_COMPONENTS_REAL_BUILD_SQL_SMOKE=PASS; PUBLISH=DENY" >> $env:GITHUB_STEP_SUMMARY
