# pgextwin Step 10 report-only Grype policy.
# Explicit config prevents caller repositories from silently injecting ignore/VEX/gating policy.
check-for-app-update: false
only-fixed: false
only-notfixed: false
ignore-wontfix: ""
fail-on-severity: ""
ignore: []
exclude: []
vex-documents: []
vex-add: []
# Grype otherwise injects built-in ignore rules for indirect Linux kernel-header matches.
# Step 10 is intentionally unfiltered, so match them instead of suppressing them.
match-upstream-kernel-headers: true
include-matcher-suppressions: false
timestamp: true

db:
  auto-update: true
  validate-age: true
  max-allowed-built-age: 120h0m0s
  require-update-check: true
